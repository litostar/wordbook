<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>单词本工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="vocab_ielts.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    kbd { font-family: monospace; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            listening: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb' },
            reading: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a' },
            extracurricular: { 50: '#faf5ff', 100: '#f3e8ff', 500: '#a855f7', 600: '#9333ea' },
            writing: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706' },
            speaking: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <!-- Mobile Top Bar -->
  <header class="md:hidden sticky top-0 z-30 bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3">
    <button onclick="app.toggleDrawer()" class="p-2 -ml-2 text-gray-600" aria-label="菜单"><i data-lucide="menu" class="w-5 h-5"></i></button>
    <h1 class="text-lg font-bold text-gray-900 flex-1">🍑的单词本</h1>
    <div class="flex bg-gray-100 rounded-lg p-0.5 text-xs font-medium">
      <button onclick="app.setView('manage')" id="m-view-manage" class="px-2.5 py-1 rounded-md transition-colors text-gray-500">单词本</button>
      <button onclick="app.setView('recite')" id="m-view-recite" class="px-2.5 py-1 rounded-md transition-colors text-gray-500">背诵</button>
      <button onclick="app.setView('marked')" id="m-view-marked" class="px-2.5 py-1 rounded-md transition-colors text-gray-500">重点</button>
      <button onclick="app.setView('prep')" id="m-view-prep" class="px-2.5 py-1 rounded-md transition-colors text-gray-500">备考</button>
    </div>
  </header>

  <!-- Drawer overlay (mobile) -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden" onclick="app.closeDrawer()"></div>

  <div id="app" class="max-w-5xl mx-auto min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar / Category -->
    <aside id="app-aside" class="bg-white border-b md:border-b-0 md:border-r border-gray-200 md:w-64 flex-shrink-0 fixed inset-y-0 left-0 z-50 w-72 max-w-[82%] overflow-y-auto transform -translate-x-full transition-transform duration-200 md:static md:translate-x-0 md:z-auto md:w-64 md:shadow-none shadow-xl">
      <div class="p-4 md:p-6">
        <div class="flex items-center gap-2 mb-6">
          <i data-lucide="book-open" class="w-6 h-6 text-indigo-600"></i>
          <h1 class="text-xl font-bold text-gray-900">🍑的单词本</h1>
        </div>

        <div class="grid grid-cols-2 gap-1 mb-6">
          <button onclick="app.setView('manage')" id="view-manage" class="flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>单词本</span>
          </button>
          <button onclick="app.setView('recite')" id="view-recite" class="flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors">
            <i data-lucide="calendar-check" class="w-4 h-4"></i>
            <span>背诵</span>
          </button>
          <button onclick="app.setView('marked')" id="view-marked" class="flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors">
            <i data-lucide="star" class="w-4 h-4"></i>
            <span>重点本</span>
          </button>
          <button onclick="app.setView('prep')" id="view-prep" class="flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors">
            <i data-lucide="target" class="w-4 h-4"></i>
            <span>备考</span>
          </button>
        </div>

        <div class="space-y-1 mb-6" id="manage-categories">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">分类</p>
          <button onclick="app.setCategory('all')" id="cat-all" class="cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left">
            <i data-lucide="layers" class="w-4 h-4"></i>
            <span>全部</span>
            <span id="count-all" class="ml-auto text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">0</span>
          </button>
          <button onclick="app.setCategory('listening')" id="cat-listening" class="cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left">
            <i data-lucide="headphones" class="w-4 h-4"></i>
            <span>听力</span>
            <span id="count-listening" class="ml-auto text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">0</span>
          </button>
          <button onclick="app.setCategory('reading')" id="cat-reading" class="cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left">
            <i data-lucide="glasses" class="w-4 h-4"></i>
            <span>阅读</span>
            <span id="count-reading" class="ml-auto text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">0</span>
          </button>
          <button onclick="app.setCategory('extracurricular')" id="cat-extracurricular" class="cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span>课外</span>
            <span id="count-extracurricular" class="ml-auto text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">0</span>
          </button>
          <button onclick="app.setCategory('writing')" id="cat-writing" class="cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left">
            <i data-lucide="pencil" class="w-4 h-4"></i>
            <span>写作</span>
            <span id="count-writing" class="ml-auto text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">0</span>
          </button>
          <button onclick="app.setCategory('speaking')" id="cat-speaking" class="cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left">
            <i data-lucide="mic" class="w-4 h-4"></i>
            <span>口语</span>
            <span id="count-speaking" class="ml-auto text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">0</span>
          </button>
        </div>

        <div class="space-y-1">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">数据</p>
          <button onclick="app.openBulkImport()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-indigo-600 hover:bg-indigo-50 transition-colors text-left">
            <i data-lucide="clipboard-paste" class="w-4 h-4"></i>
            <span>批量导入</span>
          </button>
          <button onclick="app.exportData()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span>导出 JSON</span>
          </button>
          <label class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer">
            <i data-lucide="upload" class="w-4 h-4"></i>
            <span>导入 JSON</span>
            <input type="file" accept=".json" class="hidden" onchange="app.importData(this)">
          </label>
          <button onclick="app.loadSampleData()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span>加载示例</span>
          </button>
          <button onclick="app.resetData()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-600 hover:bg-red-50 transition-colors text-left">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            <span>清空数据</span>
          </button>
          <button onclick="app.openSync()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-indigo-600 hover:bg-indigo-50 transition-colors text-left">
            <i data-lucide="cloud" class="w-4 h-4"></i>
            <span class="flex-1">云端同步</span>
            <span id="sidebar-sync-dot" class="w-2 h-2 rounded-full bg-gray-300" title="同步状态"></span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-h-0">
      <!-- Header -->
      <header id="manage-header" class="bg-white border-b border-gray-200 px-4 md:px-6 py-4 md:sticky md:top-0 z-10">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h2 id="page-title" class="text-lg font-bold text-gray-900">全部单词</h2>
            <p id="page-subtitle" class="text-sm text-gray-500 mt-0.5">按日期自动分组</p>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="text" id="search-input" placeholder="搜索单词或释义..." oninput="app.setSearch(this.value)"
                class="pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full md:w-48">
            </div>
            <button onclick="app.openBulkImport()" class="px-3 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
              <i data-lucide="clipboard-paste" class="w-4 h-4"></i>
              <span>批量导入</span>
            </button>
            <button onclick="app.toggleSelectMode()" id="btn-select-mode" class="px-3 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>多选</span>
            </button>
          </div>
        </div>
        <!-- Select mode toolbar -->
        <div id="select-toolbar" class="hidden mt-3 items-center gap-2">
          <button onclick="app.selectAll()" class="px-3 py-1.5 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">全选</button>
          <button onclick="app.deselectAll()" class="px-3 py-1.5 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">取消全选</button>
          <span id="select-count" class="text-xs text-gray-500 ml-1">已选 0 个</span>
        </div>
      </header>

      <!-- Add Word Form -->
      <div id="manage-addform" class="bg-white border-b border-gray-200 px-4 md:px-6 py-4">
        <form id="add-form" onsubmit="app.addWord(event)" class="flex flex-col md:flex-row gap-3 items-start">
          <div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 w-full">
            <div class="md:col-span-3">
              <input type="text" id="input-word" required placeholder="单词 / 短语" autocomplete="off"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-3">
              <input type="text" id="input-meaning" required placeholder="释义" autocomplete="off"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-2">
              <input type="text" id="input-note" placeholder="备注 / 例句（可选）" autocomplete="off"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-2">
              <select id="input-category" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                <option value="listening">🎧 听力</option>
                <option value="reading">📖 阅读</option>
                <option value="extracurricular">📚 课外</option>
                <option value="writing">✏️ 写作</option>
                <option value="speaking">🎤 口语</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <input type="date" id="input-date" required
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          <button type="submit"
            class="w-full md:w-auto px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>添加</span>
          </button>
        </form>
      </div>

      <!-- Word List -->
      <div id="word-list" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-24">
        <!-- Rendered by JS -->
      </div>

      <!-- Recite Plan View -->
      <div id="recite-view" class="hidden flex-1 flex flex-col min-h-0">
        <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-4 md:sticky md:top-0 z-10">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div>
              <h2 class="text-lg font-bold text-gray-900">背诵计划</h2>
              <p id="recite-subtitle" class="text-sm text-gray-500 mt-0.5">雅思高频听阅词汇</p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              <span id="sync-status" class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-500">未启用云同步</span>
              <button onclick="app.exportRecite()" class="px-3 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="download" class="w-4 h-4"></i><span>导出进度</span>
              </button>
              <label class="px-3 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5 cursor-pointer">
                <i data-lucide="upload" class="w-4 h-4"></i><span>导入进度</span>
                <input type="file" accept=".json" class="hidden" onchange="app.importRecite(this)">
              </label>
              <button onclick="app.resetRecite()" class="px-2 py-1 text-xs font-normal text-red-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors flex items-center gap-1">
                <i data-lucide="rotate-ccw" class="w-3 h-3"></i><span>清空打卡</span>
              </button>
            </div>
          </div>
        </header>
        <!-- 打卡撤销条（底部悬浮，4 秒后自动消失） -->
        <div id="recite-undo" class="hidden fixed bottom-4 left-4 right-4 z-50 md:max-w-sm md:left-1/2 md:-translate-x-1/2">
          <div class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl bg-gray-900/70 backdrop-blur text-white/90 text-sm shadow-lg">
            <span id="recite-undo-text" class="font-medium">已标记为已背</span>
            <button type="button" onclick="app.undoLast()" class="px-4 py-1.5 bg-white/90 text-indigo-700 hover:bg-white rounded-lg text-sm font-bold transition-colors">撤销</button>
          </div>
        </div>
        <div id="recite-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-28 hide-scrollbar">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Marked / Focus Book View -->
      <div id="marked-view" class="hidden flex-1 flex flex-col min-h-0">
        <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-4 md:sticky md:top-0 z-10">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div>
              <h2 class="text-lg font-bold text-gray-900">重点本</h2>
              <p class="text-sm text-gray-500 mt-0.5">标注的重点词 · 背完自动归位到原天「已背」</p>
            </div>
            <div class="flex items-center gap-2">
              <span id="marked-stat" class="text-xs px-2 py-1 rounded-full bg-amber-50 text-amber-700">重点 0 · 待复习 0</span>
              <button onclick="app.exportRecite()" class="px-3 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="download" class="w-4 h-4"></i><span>导出进度</span>
              </button>
            </div>
          </div>
        </header>
        <div id="marked-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-28 hide-scrollbar">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Prep / Exam Plan View -->
      <div id="prep-view" class="hidden flex-1 flex flex-col min-h-0">
        <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-4 md:sticky md:top-0 z-10">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div>
              <h2 class="text-lg font-bold text-gray-900">备考计划</h2>
              <p class="text-sm text-gray-500 mt-0.5">倒计时 · 量化进度 · 每日任务</p>
            </div>
            <div class="flex items-center gap-2">
              <span id="prep-countdown" class="text-xs px-2 py-1 rounded-full bg-indigo-50 text-indigo-700">距考试 -- 天</span>
              <button onclick="app.togglePrepSettings()" class="px-3 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <i data-lucide="settings" class="w-4 h-4"></i><span id="prep-settings-btn-text">备考设置</span>
              </button>
            </div>
          </div>
        </header>
        <div id="prep-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-28 hide-scrollbar">
          <!-- Rendered by JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- Batch Action Bar (floating bottom) -->
  <div id="batch-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg hidden z-40">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-4 md:px-6 py-3 gap-2">
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-700">已选 <span id="batch-count" class="text-indigo-600 font-bold">0</span> 个</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <select id="batch-move-category" class="text-sm border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">移动到...</option>
          <option value="listening">听力</option>
          <option value="reading">阅读</option>
          <option value="extracurricular">课外</option>
          <option value="writing">写作</option>
          <option value="speaking">口语</option>
        </select>
        <button onclick="app.batchMove()" class="px-3 py-1.5 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors">移动</button>
        <button onclick="app.batchExport()" class="px-3 py-1.5 text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">导出选中</button>
        <button onclick="app.batchDelete()" class="px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">删除</button>
        <button onclick="app.toggleSelectMode()" class="px-3 py-1.5 text-sm font-medium text-gray-500 hover:bg-gray-100 rounded-lg transition-colors">退出</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <h3 class="font-bold text-gray-900">编辑单词</h3>
        <button onclick="app.closeEditModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="app.saveEdit(event)" class="p-5 space-y-3">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">分类</label>
          <select id="edit-category" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="listening">听力</option>
            <option value="reading">阅读</option>
            <option value="extracurricular">课外</option>
            <option value="writing">写作</option>
            <option value="speaking">口语</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">单词</label>
          <input type="text" id="edit-word" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">释义</label>

  <script>
    const STORAGE_KEY = 'wordbook_v1';
    const CATEGORIES = {
      listening: { name: '听力', color: 'listening', icon: 'headphones' },
      reading: { name: '阅读', color: 'reading', icon: 'glasses' },
      extracurricular: { name: '课外', color: 'extracurricular', icon: 'sparkles' },
      writing: { name: '写作', color: 'writing', icon: 'pencil' },
      speaking: { name: '口语', color: 'speaking', icon: 'mic' }
    };

    const DEFAULT_WORDS = [
      { id: '1', word: 'marginalize', meaning: '边缘化', note: '', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:00.000Z', mastered: false },
      { id: '2', word: 'low-cost', meaning: '低成本', note: '', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:01.000Z', mastered: false },
      { id: '3', word: 'e-commerce', meaning: '电商', note: 'e-commerce economy 电商经济', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:02.000Z', mastered: false },
      { id: '4', word: 'bouquet', meaning: '花束', note: '', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:03.000Z', mastered: false },
      { id: '5', word: 'logistical', meaning: '后勤的', note: '', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:04.000Z', mastered: false },
      { id: '6', word: 'perishable', meaning: '容易枯萎的', note: '', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:05.000Z', mastered: false },
      { id: '7', word: 'moist', meaning: '潮湿的', note: 'moisture 潮气、水气', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:06.000Z', mastered: false },
      { id: '8', word: 'interprovincial', meaning: '跨省的', note: '', category: 'extracurricular', date: '2026-08-05', createdAt: '2026-08-05T00:00:07.000Z', mastered: false }
    ];

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function utf8ToBase64(str) {
      return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)));
    }
    function base64ToUtf8(b64) {
      return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      const diff = Math.round((today - d) / 86400000);
      let label = '';
      if (diff === 0) label = '今天';
      else if (diff === 1) label = '昨天';
      else if (diff === -1) label = '明天';
      else label = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
      return `${d.getMonth() + 1}月${d.getDate()}日 · ${label}`;
    }

    class WordBookApp {
      constructor() {
        this.state = {
          category: 'all',
          search: '',
          words: [],
          selectMode: false,
          selectedIds: new Set()
        };
        this.bulkParsed = [];
        this.view = 'manage';
        this.recite = {
          days: 30,
          startDate: this.todayStr(),
          checked: new Set(),
          recalled: new Set(),
          reveal: {},
          collapsedDone: true,
          selectedDay: null,
          dayCloudOpen: false,
          marked: new Set(),
          markedDoneCollapsed: true,
          checkedAt: {}
        };
        this.prep = {
          examDate: '2026-10-15',
          target: { L: 7.5, R: 7.5, S: 6, W: 6 },
          currentTotal: 6.5,
          testsTotal: 44,
          testsDone: { L: 0, R: 0 },
          writingGoal: 24,
          writingDone: 0,
          speakingGoal: 56,
          speakingDone: 0,
          daily: {},
          settingsOpen: false
        };
        // 背诵视图入场动画只播一次（切到该视图时），避免每次勾选/展开重播导致页面"上下跳"
        this._reciteEntered = false;
        this.undoIndex = null;
        this.undoTimer = null;
        this.loadData();
        this.loadRecite();
        this.loadPrep();
        if (this.syncEnabled()) {
          this.updateSyncStatus('同步中…', 'syncing');
          this.pullRecite();
        } else {
          this.updateSyncStatus('未启用云同步', 'idle');
        }
        this.init();
      }

      todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }

      init() {
        document.getElementById('input-date').valueAsDate = new Date();
        this.setView('recite');
        this.renderCategories();
        this.render();
        lucide.createIcons();
      }

      setView(v) {
        this.view = v;
        const isRecite = v === 'recite';
        const isMarked = v === 'marked';
        const isPrep = v === 'prep';
        const hideManage = isRecite || isMarked || isPrep;
        const manageEls = ['manage-header', 'manage-addform', 'word-list', 'manage-categories'];
        manageEls.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.display = hideManage ? 'none' : (id === 'word-list' ? 'block' : '');
        });
        document.getElementById('recite-view').style.display = isRecite ? 'flex' : 'none';
        document.getElementById('marked-view').style.display = isMarked ? 'flex' : 'none';
        document.getElementById('prep-view').style.display = isPrep ? 'flex' : 'none';
        // 视图切换按钮高亮（桌面侧栏 + 手机顶栏）
        const activeCls = 'bg-white text-indigo-700 shadow-sm';
        const idleCls = 'text-gray-500 hover:bg-gray-200';
        ['view-manage', 'm-view-manage'].forEach(id => { const el = document.getElementById(id); if (el) el.className = 'flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors ' + (v === 'manage' ? activeCls : idleCls); });
        ['view-recite', 'm-view-recite'].forEach(id => { const el = document.getElementById(id); if (el) el.className = 'flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors ' + (isRecite ? activeCls : idleCls); });
        ['view-marked', 'm-view-marked'].forEach(id => { const el = document.getElementById(id); if (el) el.className = 'flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors ' + (isMarked ? activeCls : idleCls); });
        ['view-prep', 'm-view-prep'].forEach(id => { const el = document.getElementById(id); if (el) el.className = 'flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-sm font-medium transition-colors ' + (isPrep ? activeCls : idleCls); });
        this.closeDrawer();
        if (isRecite) { this._reciteEntered = false; this.renderRecite(); }
        if (isMarked) { this.renderMarked(); }
        if (isPrep) { this.renderPrep(); }
      }

      renderCurrentView() {
        if (this.view === 'marked') this.renderMarked();
        else if (this.view === 'recite') this.renderRecite();
        else if (this.view === 'prep') this.renderPrep();
        else this.render();
      }

      // ===== Recite Plan =====

      loadRecite() {
        try {
          const raw = localStorage.getItem('wordbook_recite_v2');
          if (raw) {
            const d = JSON.parse(raw);
            this.recite.days = d.days || 30;
            this.recite.startDate = d.startDate || this.todayStr();
            this.recite.checked = new Set(d.checked || []);
            this.recite.recalled = new Set(d.recalled || []);
            this.recite.collapsedDone = d.collapsedDone !== false;
            this.recite.selectedDay = d.selectedDay || null;
            this.recite.dayCloudOpen = !!d.dayCloudOpen;
            this.recite.marked = new Set(d.marked || []);
            this.recite.markedDoneCollapsed = d.markedDoneCollapsed !== false;
            this.recite.checkedAt = d.checkedAt || {};
          } else {
            // 从 v1 迁移：保留计划参数（天数/开始日期），但 v1 的打卡是按索引存的，
            // 词表重新解析后索引失效，故打卡/回撤重置为空，避免错位。
            const old = localStorage.getItem('wordbook_recite_v1');
            if (old) {
              try {
                const d = JSON.parse(old);
                this.recite.days = d.days || 30;
                this.recite.startDate = d.startDate || this.todayStr();
                this.recite.selectedDay = d.selectedDay || null;
              } catch (e) {}
            }
          }
        } catch (e) {}
        if (!this.recite.selectedDay) this.recite.selectedDay = this.todayDayNum();
      }

      saveRecite() {
        localStorage.setItem('wordbook_recite_v2', JSON.stringify({
          days: this.recite.days,
          startDate: this.recite.startDate,
          checked: [...this.recite.checked],
          recalled: [...this.recite.recalled],
          collapsedDone: this.recite.collapsedDone,
          selectedDay: this.recite.selectedDay,
          dayCloudOpen: this.recite.dayCloudOpen,
          marked: [...this.recite.marked],
          markedDoneCollapsed: this.recite.markedDoneCollapsed,
          checkedAt: this.recite.checkedAt
        }));
        this.scheduleSyncPush();
      }

      // ===== Prep / Exam Plan =====
      loadPrep() {
        try {
          const raw = localStorage.getItem('wordbook_prep_v1');
          if (raw) {
            const d = JSON.parse(raw);
            this.prep.examDate = d.examDate || this.prep.examDate;
            this.prep.target = Object.assign({}, this.prep.target, d.target || {});
            if (typeof d.currentTotal === 'number') this.prep.currentTotal = d.currentTotal;
            if (typeof d.testsTotal === 'number') this.prep.testsTotal = d.testsTotal;
            this.prep.testsDone = Object.assign({ L: 0, R: 0 }, d.testsDone || {});
            if (typeof d.writingGoal === 'number') this.prep.writingGoal = d.writingGoal;
            if (typeof d.writingDone === 'number') this.prep.writingDone = d.writingDone;
            if (typeof d.speakingGoal === 'number') this.prep.speakingGoal = d.speakingGoal;
            if (typeof d.speakingDone === 'number') this.prep.speakingDone = d.speakingDone;
            this.prep.daily = d.daily || {};
          }
        } catch (e) {}
      }

      savePrep() {
        localStorage.setItem('wordbook_prep_v1', JSON.stringify({
          examDate: this.prep.examDate,
          target: this.prep.target,
          currentTotal: this.prep.currentTotal,
          testsTotal: this.prep.testsTotal,
          testsDone: this.prep.testsDone,
          writingGoal: this.prep.writingGoal,
          writingDone: this.prep.writingDone,
          speakingGoal: this.prep.speakingGoal,
          speakingDone: this.prep.speakingDone,
          daily: this.prep.daily
        }));
        this.scheduleSyncPush();
      }

      prepLeftDays() {
        if (!this.prep.examDate) return null;
        const exam = new Date(this.prep.examDate + 'T00:00:00');
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        return Math.max(0, Math.round((exam - now) / 86400000));
      }

      prepStage(days) {
        if (days == null) return { name: '未设置', cls: 'bg-gray-100 text-gray-500' };
        if (days > 35) return { name: '基础期', cls: 'bg-indigo-50 text-indigo-700' };
        if (days > 14) return { name: '强化期', cls: 'bg-amber-50 text-amber-700' };
        return { name: '冲刺期', cls: 'bg-rose-50 text-rose-700' };
      }

      prepPct(done, total) {
        return total > 0 ? Math.min(100, Math.round(done / total * 100)) : 0;
      }

      renderPrep() {
        const content = document.getElementById('prep-content');
        if (!content) return;
        const p = this.prep;
        const t = p.target;
        const leftDays = this.prepLeftDays();
        const stage = this.prepStage(leftDays);
        const totalWords = (window.VOCAB_IELTS || []).length;
        const wordDone = this.recite.checked.size;
        const wordLeft = Math.max(0, totalWords - wordDone);
        const wordPerDay = leftDays > 0 ? Math.ceil(wordLeft / leftDays) : wordLeft;
        const listenLeft = Math.max(0, p.testsTotal - p.testsDone.L);
        const readLeft = Math.max(0, p.testsTotal - p.testsDone.R);
        const speakLeft = Math.max(0, p.speakingGoal - p.speakingDone);
        const writeLeft = Math.max(0, p.writingGoal - p.writingDone);
        const today = this.todayStr();
        const done = p.daily[today] || {};
        const plan = this.computePlan();
        const perDay = plan.perDay;
        const wordAutoDone = this.todayRecitedCount() >= perDay;

        // 头部倒计时
        const countdown = leftDays == null ? '未设置考试日期'
          : leftDays === 0 ? '今天就是考试日！'
          : leftDays + ' 天';
        const cdCls = leftDays == null ? 'text-gray-400'
          : leftDays <= 7 ? 'text-rose-600'
          : leftDays <= 14 ? 'text-rose-500'
          : leftDays <= 35 ? 'text-amber-600'
          : 'text-indigo-600';

        // 目标分徽章
        const badge = (k, label) => `<span class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-semibold">${label} ${t[k] != null ? t[k] : '—'}</span>`;

        // 量化进度面板
        const bars = [
          ['单词', wordDone, totalWords, 'bg-indigo-500'],
          ['听力真题', p.testsDone.L, p.testsTotal, 'bg-emerald-500'],
          ['阅读真题', p.testsDone.R, p.testsTotal, 'bg-sky-500'],
          ['口语录音', p.speakingDone, p.speakingGoal, 'bg-violet-500'],
          ['写作篇数', p.writingDone, p.writingGoal, 'bg-orange-500']
        ].map(([name, d, tot, color]) => {
          const pct = this.prepPct(d, tot);
          return `<div class="bg-white border border-gray-200 rounded-2xl p-4">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-gray-500">${name}</span>
              <span class="text-xs font-bold text-gray-800">${d}/${tot} · ${pct}%</span>
            </div>
            <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full ${color} rounded-full transition-all" style="width:${pct}%"></div>
            </div>
            <p class="text-[11px] text-gray-400 mt-1.5">${(tot - d) > 0 ? '还剩 ' + (tot - d) + ' 未完成' : '✅ 已完成'}</p>
          </div>`;
        }).join('');

        // 今日任务清单（剩余>0 才列出）
        const taskKeys = [];

        content.innerHTML = `

      togglePrepSettings() {

      togglePrepTask(key) {
        const today = this.todayStr();
        if (!this.prep.daily[today]) this.prep.daily[today] = {};
        this.prep.daily[today][key] = !this.prep.daily[today][key];
        this.savePrep();
        this.renderPrep();
      }

      savePrepSettings() {
        const g = id => document.getElementById(id);
        const num = (id, def) => { const el = g(id); if (!el) return def; const v = parseFloat(el.value); return isNaN(v) ? def : v; };
        this.prep.examDate = (g('prep-exam-date') && g('prep-exam-date').value) || this.prep.examDate;
        this.prep.target.L = num('prep-target-L', this.prep.target.L);
        this.prep.target.R = num('prep-target-R', this.prep.target.R);
        this.prep.target.S = num('prep-target-S', this.prep.target.S);
        this.prep.target.W = num('prep-target-W', this.prep.target.W);
        this.prep.currentTotal = num('prep-current-total', this.prep.currentTotal);
        this.prep.testsTotal = num('prep-tests-total', this.prep.testsTotal);
        this.prep.testsDone.L = num('prep-listen-done', this.prep.testsDone.L);
        this.prep.testsDone.R = num('prep-read-done', this.prep.testsDone.R);
        this.prep.speakingDone = num('prep-speak-done', this.prep.speakingDone);
        this.prep.speakingGoal = num('prep-speak-goal', this.prep.speakingGoal);
        this.prep.writingDone = num('prep-write-done', this.prep.writingDone);
        this.prep.writingGoal = num('prep-write-goal', this.prep.writingGoal);
        this.savePrep();
        this.renderPrep();
        alert('备考设置已保存');
      }

      computePlan() {
        const total = (window.VOCAB_IELTS || []).length;
        const days = Math.max(1, this.recite.days);
        const perDay = Math.ceil(total / days);
        return { total, days, perDay };
      }

      todayDayNum() {
        const start = new Date(this.recite.startDate + 'T00:00:00');
        const now = new Date(); now.setHours(0,0,0,0); start.setHours(0,0,0,0);
        const diff = Math.floor((now - start) / 86400000);
        const { days } = this.computePlan();
        let day = diff + 1;
        if (day < 1) day = 1;
        if (day > days) day = days;
        return day;
      }

      getDayWords(day) {
        const { total, perDay } = this.computePlan();
        const start = (day - 1) * perDay;
        const end = Math.min(start + perDay, total);
        const list = [];
        for (let i = start; i < end; i++) {
          const v = window.VOCAB_IELTS[i];
          if (v) list.push({ word: v.word, phon: v.phon, meaning: v.meaning });
        }
        return list;
      }

      dayDoneCount(day) {
        return this.getDayWords(day).filter(w => this.recite.checked.has(w.word)).length;
      }

      // 今天背了多少词（不论来自计划哪一天或重点本）：按勾选时间戳统计
      todayRecitedCount() {
        const today = this.todayStr();
        let n = 0;
        for (const w in this.recite.checkedAt) if (this.recite.checkedAt[w] === today) n++;
        return n;
      }

      // 连续打卡天数：从今天往前数，遇到"当天没背"即断开（今天还没背则从昨天起算）
      streakDays() {
        const dates = new Set(Object.values(this.recite.checkedAt));
        if (dates.size === 0) return 0;
        const d = new Date(); d.setHours(0,0,0,0);
        let offset = dates.has(this.todayStr()) ? 0 : 1;
        let streak = 0;
        for (let guard = 0; guard < 3650; guard++) {
          const dayStr = (() => { const x = new Date(d.getTime() - offset*86400000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; })();
          if (dates.has(dayStr)) { streak++; offset++; } else break;
        }
        return streak;
      }

      // 天数 chip 颜色：按完成进度给绿色色阶，选中用 indigo，今天保留 fire 标记
      getDayChipClass(done, total, isSel, isToday) {
        if (isSel) return {
          bg: 'bg-indigo-600 text-white border-indigo-600',
          count: 'text-white/80'
        };
        if (isToday) return {
          bg: 'bg-indigo-50 text-indigo-700 border-indigo-300 ring-2 ring-indigo-100',
          count: 'opacity-80'
        };
        if (total === 0 || done === 0) return {
          bg: 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50',
          count: 'opacity-70'
        };
        if (done >= total) return {
          bg: 'bg-green-500 text-white border-green-600',
          count: 'text-white/90'
        };
        const pct = done / total;
        if (pct < 0.34) return {
          bg: 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100',
          count: 'opacity-80'
        };
        if (pct < 0.67) return {
          bg: 'bg-green-100 text-green-800 border-green-300 hover:bg-green-200',
          count: 'opacity-90'
        };
        return {
          bg: 'bg-green-200 text-green-900 border-green-400 hover:bg-green-300',
          count: 'opacity-90'
        };
      }

        this.flashSaved();

        content.innerHTML = `<div class="${entrance}">
