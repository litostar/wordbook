        `;
        const cd = document.getElementById('prep-countdown');
        if (cd) cd.textContent = leftDays == null ? '未设置日期' : '距考试 ' + leftDays + ' 天';
        const btnTxt = document.getElementById('prep-settings-btn-text');
        if (btnTxt) btnTxt.textContent = p.settingsOpen ? '收起设置' : '备考设置';
        lucide.createIcons();
      }

      togglePrepSettings() {
        this.prep.settingsOpen = !this.prep.settingsOpen;
        this.renderPrep();
        if (this.prep.settingsOpen) {
          const panel = document.getElementById('prep-settings-panel');
          if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      togglePrepTask(key) {
        const today = this.todayStr();
        if (!this.prep.daily[today]) this.prep.daily[today] = {};
        this.prep.daily[today][key] = !this.prep.daily[today][key];
        this.updateDiaryToday();
        this.savePrep();
        this.renderPrep();
      }

      // 真题打卡：Test 级别全选/取消
      toggleListenTest(book, test) { this.toggleTestAll('L', book, test, 4); }
      toggleReadTest(book, test) { this.toggleTestAll('R', book, test, 3); }
      toggleTestAll(kind, book, test, secCount) {
        const set = kind === 'L' ? this.prep.listenDone : this.prep.readDone;
        const doneAt = kind === 'L' ? this.prep.listenDoneAt : this.prep.readDoneAt;
        const undoneAt = kind === 'L' ? this.prep.listenUndoneAt : this.prep.readUndoneAt;
        const keys = Array.from({ length: secCount }, (_, i) => `${kind}-${book}-${test}-${i + 1}`);
        const allDone = keys.every(k => set.has(k));
        const now = this.nowISO();
        if (allDone) {
          keys.forEach(k => { set.delete(k); delete doneAt[k]; undoneAt[k] = now; });
        } else {
          keys.forEach(k => { set.add(k); doneAt[k] = now; delete undoneAt[k]; });
        }
        this.updateDiaryToday();
        this.savePrep();
        this.renderPrep();
      }
      toggleListenSection(book, test, section) { this.toggleSection('L', book, test, section); }
      toggleReadSection(book, test, section) { this.toggleSection('R', book, test, section); }
      toggleSection(kind, book, test, section) {
        const key = `${kind}-${book}-${test}-${section}`;
        const set = kind === 'L' ? this.prep.listenDone : this.prep.readDone;
        const doneAt = kind === 'L' ? this.prep.listenDoneAt : this.prep.readDoneAt;
        const undoneAt = kind === 'L' ? this.prep.listenUndoneAt : this.prep.readUndoneAt;
        const now = this.nowISO();
        if (set.has(key)) {
          set.delete(key);
          delete doneAt[key];
          undoneAt[key] = now;
        } else {
          set.add(key);
          doneAt[key] = now;
          delete undoneAt[key];
        }
        this.updateDiaryToday();
        this.savePrep();
        this.renderPrep();
      }
      toggleExpand(kind, book, test) {
        const map = kind === 'L' ? this.prep.listenExpanded : this.prep.readExpanded;
        const ek = `${book}-${test}`;
        map[ek] = !map[ek];
        this.renderPrep();
      }

      // 备考日记：把今天的工作量（背词/听读小节/写口）汇总进 diary[today]
      updateDiaryToday() {
        const today = this.todayStr();
        const done = this.prep.daily[today] || {};
        const countToday = (at) => Object.values(at || {}).filter(ts => String(ts).slice(0, 10) === today).length;
        const prev = this.prep.diary[today] || {};
        this.prep.diary[today] = {
          word: this.todayRecitedCount(),
          listen: countToday(this.prep.listenDoneAt),
          read: countToday(this.prep.readDoneAt),
          write: done.write ? 1 : 0,
          speak: done.speak ? 1 : 0,
          writeLog: prev.writeLog || [],
          speakLog: prev.speakLog || []
        };
      }

      // 备考日记：写作/口语手动记录（输入框 → 保存到今日日记）
      saveDiaryNote(kind) {
        const today = this.todayStr();
        const el = document.getElementById('diary-note-' + kind);
        if (!el) return;
        const text = (el.value || '').trim();
        if (!text) { this.showToast('先写点内容再保存'); return; }
        const key = kind === 'write' ? 'writeLog' : 'speakLog';
        const prev = this.prep.diary[today] || {};
        const logs = Array.isArray(prev[key]) ? prev[key].slice() : [];
        logs.push({ t: this.nowHM(), text });
        this.prep.diary[today] = Object.assign({}, prev, { [key]: logs });
        el.value = '';
        this.updateDiaryToday(); // 保留 writeLog/speakLog 并刷新自动数字
        this.savePrep();
        this.renderPrep();
        this.showToast('已记入今日备考日记');
      }

      buildBookRange(from, to) {
        const lo = Math.max(1, Math.min(from, to));
        const hi = Math.max(1, Math.max(from, to));
        const arr = [];
        for (let i = lo; i <= hi; i++) arr.push(i);
        return arr;
      }

      savePrepSettings() {
        const g = id => document.getElementById(id);
        const num = (id, def) => { const el = g(id); if (!el) return def; const v = parseFloat(el.value); return isNaN(v) ? def : v; };
        this.prep.examDate = (g('prep-exam-date') && g('prep-exam-date').value) || this.prep.examDate;
        this.prep.target.L = num('prep-target-L', this.prep.target.L);
        this.prep.target.R = num('prep-target-R', this.prep.target.R);
        this.prep.target.S = num('prep-target-S', this.prep.target.S);
        this.prep.target.W = num('prep-target-W', this.prep.target.W);
        this.prep.currentTotal = num('prep-current-total', this.prep.currentTotal);
        this.prep.listenBooks = this.buildBookRange(num('prep-listen-books-from', this.prep.listenBooks[0]), num('prep-listen-books-to', this.prep.listenBooks[this.prep.listenBooks.length - 1]));
        this.prep.readBooks = this.buildBookRange(num('prep-read-books-from', this.prep.readBooks[0]), num('prep-read-books-to', this.prep.readBooks[this.prep.readBooks.length - 1]));
        this.prep.speakingDone = num('prep-speak-done', this.prep.speakingDone);
        this.prep.speakingGoal = num('prep-speak-goal', this.prep.speakingGoal);
        this.prep.writingDone = num('prep-write-done', this.prep.writingDone);
        this.prep.writingGoal = num('prep-write-goal', this.prep.writingGoal);
        this.updateDiaryToday();
        this.savePrep();
        this.renderPrep();
        alert('备考设置已保存');
      }

      computePlan() {
        const total = (window.VOCAB_IELTS || []).length;
        const days = Math.max(1, this.recite.days);
        const perDay = Math.ceil(total / days);
        return { total, days, perDay };
      }

      todayDayNum() {
        const start = new Date(this.recite.startDate + 'T00:00:00');
        const now = new Date(); now.setHours(0,0,0,0); start.setHours(0,0,0,0);
        const diff = Math.floor((now - start) / 86400000);
        const { days } = this.computePlan();
        let day = diff + 1;
        if (day < 1) day = 1;
        if (day > days) day = days;
        return day;
      }

      getDayWords(day) {
        const { total, perDay } = this.computePlan();
        const start = (day - 1) * perDay;
        const end = Math.min(start + perDay, total);
        const list = [];
        for (let i = start; i < end; i++) {
          const v = window.VOCAB_IELTS[i];
          if (v) list.push({ word: v.word, phon: v.phon, meaning: v.meaning });
        }
        return list;
      }

      dayDoneCount(day) {
        return this.getDayWords(day).filter(w => this.recite.checked.has(w.word)).length;
      }

      // 今天背了多少词（不论来自计划哪一天或重点本）：按勾选时间戳统计
      todayRecitedCount() {
        const today = this.todayStr();
        let n = 0;
        for (const w in this.recite.checkedAt) {
          const d = this.dateFromIso(this.recite.checkedAt[w]) || this.recite.checkedAt[w];
          if (d === today) n++;
        }
        return n;
      }

      // 连续打卡天数：从今天往前数，遇到"当天没背"即断开（今天还没背则从昨天起算）
      streakDays() {
        const dates = new Set(Object.values(this.recite.checkedAt).map(v => this.dateFromIso(v) || v));
        if (dates.size === 0) return 0;
        const d = new Date(); d.setHours(0,0,0,0);
        let offset = dates.has(this.todayStr()) ? 0 : 1;
        let streak = 0;
        for (let guard = 0; guard < 3650; guard++) {
          const dayStr = (() => { const x = new Date(d.getTime() - offset*86400000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; })();
          if (dates.has(dayStr)) { streak++; offset++; } else break;
        }
        return streak;
      }

      // 天数 chip 颜色：按完成进度给绿色色阶，选中用 indigo，今天保留 fire 标记
      getDayChipClass(done, total, isSel, isToday) {
        if (isSel) return {
          bg: 'bg-indigo-600 text-white border-indigo-600',
          count: 'text-white/80'
        };
        if (isToday) return {
          bg: 'bg-indigo-50 text-indigo-700 border-indigo-300 ring-2 ring-indigo-100',
          count: 'opacity-80'
        };
        if (total === 0 || done === 0) return {
          bg: 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50',
          count: 'opacity-70'
        };
        if (done >= total) return {
          bg: 'bg-green-500 text-white border-green-600',
          count: 'text-white/90'
        };
        const pct = done / total;
        if (pct < 0.34) return {
          bg: 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100',
          count: 'opacity-80'
        };
        if (pct < 0.67) return {
          bg: 'bg-green-100 text-green-800 border-green-300 hover:bg-green-200',
          count: 'opacity-90'
        };
        return {
          bg: 'bg-green-200 text-green-900 border-green-400 hover:bg-green-300',
          count: 'opacity-90'
        };
      }

      saveRecitePlan() {
        const daysVal = parseInt(document.getElementById('recite-days-input').value, 10);
        const startVal = document.getElementById('recite-start-input').value;
        if (!daysVal || daysVal < 1) { alert('请输入有效的天数'); return; }
        this.recite.days = daysVal;
        if (startVal) this.recite.startDate = startVal;
        this.recite.selectedDay = this.todayDayNum();
        this.saveRecite();
        this.renderRecite();
        this.flashSaved();
      }

      flashSaved() {
        const el = document.getElementById('recite-saved');
        if (!el) return;
        el.classList.remove('opacity-0');
        setTimeout(() => el.classList.add('opacity-0'), 1500);
      }

      renderRecite() {
        const { total, days, perDay } = this.computePlan();
        const content = document.getElementById('recite-content');
        if (!window.VOCAB_IELTS) {
          content.innerHTML = '<div class="text-center text-gray-400 py-16">词表正在加载…</div>';
          return;
        }
        // 入场动画：仅首次进入背诵视图时播放一次；后续勾选/展开等状态更新不再重播，避免页面"上下跳"
        const entrance = this._reciteEntered ? '' : 'fade-in';
        this._reciteEntered = true;
        const checkedCount = this.recite.checked.size;
        const todayDay = this.todayDayNum();
        const selDay = this.recite.selectedDay || todayDay;
        const selWords = this.getDayWords(selDay);
        const selDone = selWords.filter(w => this.recite.checked.has(w.word)).length;
        const toDo = selWords.filter(w => !this.recite.checked.has(w.word));
        const done = selWords.filter(w => this.recite.checked.has(w.word));
        const recalledCount = toDo.filter(w => this.recite.recalled.has(w.word)).length;
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        const todayCount = this.todayRecitedCount();
        const streak = this.streakDays();

        // 天数提示
        let dayHint = `今天：第 ${todayDay} 天 / 共 ${days} 天`;
        const start = new Date(this.recite.startDate + 'T00:00:00');
        const now = new Date(); now.setHours(0,0,0,0); start.setHours(0,0,0,0);
        if (Math.floor((now - start)/86400000) < 0) dayHint = `尚未开始（开始于 ${this.recite.startDate}）· 预览第 ${selDay} 天`;
        else if (todayDay >= days) dayHint = `计划已完成 🎉（共 ${days} 天）`;

        content.innerHTML = `<div class="${entrance}">
          <!-- 计划设置 -->
          <div class="bg-white border border-gray-200 rounded-2xl p-5">
            <div class="flex items-center gap-2 mb-4">
              <i data-lucide="sliders-horizontal" class="w-5 h-5 text-indigo-600"></i>
              <h3 class="font-bold text-gray-900">制定计划</h3>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-4">
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">总词数</label>
                <div class="px-3 py-2 text-sm bg-gray-50 rounded-lg text-gray-700 font-medium">${total}</div>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">目标天数</label>
                <input type="number" id="recite-days-input" min="1" value="${days}" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">开始日期</label>
                <input type="date" id="recite-start-input" value="${this.recite.startDate}" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">每天约背</label>
                <div class="px-3 py-2 text-sm bg-indigo-50 rounded-lg text-indigo-700 font-bold">${perDay} 词</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="app.saveRecitePlan()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">保存计划</button>
              <span id="recite-saved" class="text-xs text-green-600 opacity-0 transition-opacity flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i>已保存</span>
            </div>
          </div>

          <!-- 每日进度（今天背了多少，不论来自计划哪一天或重点本） -->
          <div class="bg-white border border-gray-200 rounded-2xl p-5">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-semibold text-gray-700">今日进度</span>
              <span class="text-sm ${todayCount >= perDay ? 'text-green-600 font-semibold' : 'text-gray-500'}">${todayCount} / ${perDay} 词 · ${perDay ? Math.round(todayCount/perDay*100) : 0}%</span>
            </div>
            <div class="h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all ${todayCount >= perDay ? 'bg-green-500' : 'bg-indigo-600'}" style="width:${perDay ? Math.min(100, Math.round(todayCount/perDay*100)) : 0}%"></div>
            </div>
            <p class="text-xs text-gray-400 mt-2">${todayCount >= perDay ? '今日目标已达成 🎉' : '距今日目标还差 ' + Math.max(0, perDay - todayCount) + ' 词'} · 连续打卡 ${streak} 天</p>
          </div>

          <!-- 总体进度 -->
          <div class="bg-white border border-gray-200 rounded-2xl p-5">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-semibold text-gray-700">总体进度</span>
              <span class="text-sm text-gray-500">已背 ${checkedCount} / ${total} · ${total ? Math.round(checkedCount/total*100) : 0}%</span>
            </div>
            <div class="h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full bg-indigo-600 rounded-full transition-all" style="width:${total? Math.round(checkedCount/total*100):0}%"></div>
            </div>
            <p class="text-xs text-gray-400 mt-2">打卡即时保存，可随时「导出进度」备份，换设备后「导入进度」恢复。</p>
          </div>

          <!-- 天数导航 -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-bold text-gray-700">${dayHint}</h3>
              <button type="button" onclick="app.gotoDay(${todayDay})" class="text-xs text-indigo-600 hover:underline ${selDay === todayDay ? 'invisible' : ''}">回到今天</button>
            </div>
            <!-- 上一天 / 第N天 / 下一天：手机桌面都好用，避免翻一长串 chips -->
            <div class="flex items-center gap-2 mb-3">
              <button type="button" onclick="app.gotoDay(${Math.max(1, selDay - 1)})" ${selDay <= 1 ? 'disabled' : ''} class="px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 ${selDay <= 1 ? 'text-gray-300 bg-gray-50 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50'}">‹ 上一天</button>
              <div class="flex-1 text-center text-sm font-semibold text-gray-800">第 ${selDay} 天 / 共 ${days} 天</div>
              <button type="button" onclick="app.gotoDay(${Math.min(days, selDay + 1)})" ${selDay >= days ? 'disabled' : ''} class="px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 ${selDay >= days ? 'text-gray-300 bg-gray-50 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50'}">下一天 ›</button>
            </div>
            <!-- 全部天数 chips：桌面常显；手机默认折叠，点开选具体天 -->
            <div id="recite-day-cloud" class="flex flex-wrap gap-2 ${this.recite.dayCloudOpen ? '' : 'hidden'} md:!flex">
              ${Array.from({length: days}, (_, i) => {
                const d = i + 1;
                const done = this.dayDoneCount(d);
                const wds = this.getDayWords(d).length;
                const isSel = d === selDay;
                const isToday = d === todayDay;
                const chipCls = this.getDayChipClass(done, wds, isSel, isToday);
                return `<button type="button" onclick="app.gotoDay(${d})" class="min-w-[2.75rem] px-2.5 py-2 rounded-lg text-xs font-medium border transition-colors ${chipCls.bg}">
                  ${isToday ? '🔥' : ''}${d}<span class="${chipCls.count} ml-1">${done}/${wds}</span>
                </button>`;
              }).join('')}
            </div>
            <button type="button" onclick="app.toggleDayCloud()" class="md:hidden text-xs text-indigo-600 hover:underline mt-2">${this.recite.dayCloudOpen ? '收起全部天数 ▴' : '展开全部天数 ▾'}</button>
          </div>

          <!-- 待背列表 -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold text-gray-700">第 ${selDay} 天 · 待背 ${toDo.length} 词${recalledCount ? ` · ${recalledCount} 个回撤` : ''}</h3>
              <button onclick="app.toggleRevealAll()" class="text-xs text-indigo-600 hover:underline">${allOpen ? '收起全部释义' : '展开全部释义'}</button>
            </div>
            ${toDo.length ? `<div class="grid grid-cols-1 gap-2">${toDo.map(w => this.renderReciteCard(w, 'todo')).join('')}</div>` : `<div class="text-center text-sm text-gray-400 py-10">🎉 今日单词已全部背完！</div>`}
          </div>

          <!-- 已背折叠区 -->
          ${done.length ? `
          <div>
            <button onclick="app.toggleDoneCollapse()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-green-50 border border-green-200 text-sm font-medium text-green-700 hover:bg-green-100 transition-colors">
              <span>✓ 已背 ${done.length} 词（点击${this.recite.collapsedDone ? '展开' : '收起'}）</span>
              <i data-lucide="${this.recite.collapsedDone ? 'chevron-down' : 'chevron-up'}" class="w-4 h-4"></i>
            </button>
            ${this.recite.collapsedDone ? '' : `<div class="grid grid-cols-1 gap-2 mt-2">${done.map(w => this.renderReciteCard(w, 'done')).join('')}</div>`}
          </div>
          ` : ''}
          </div>
        `;
        lucide.createIcons();
      }

      renderMarked() {
        const content = document.getElementById('marked-content');
        if (!content) return;
        if (!window.VOCAB_IELTS) {
          content.innerHTML = '<div class="text-center text-gray-400 py-16">词表正在加载…</div>';
          return;
        }
        const all = (window.VOCAB_IELTS || []).filter(w => this.recite.marked.has(w.word));
        const toDo = all.filter(w => !this.recite.checked.has(w.word));
        const done = all.filter(w => this.recite.checked.has(w.word));
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        const stat = document.getElementById('marked-stat');
        if (stat) stat.textContent = `重点 ${all.length} · 待复习 ${toDo.length} · 今日 ${this.todayRecitedCount()}/${this.computePlan().perDay}`;
        content.innerHTML = `
          ${all.length === 0 ? `<div class="text-center text-sm text-gray-400 py-10">还没有标注重点词。在「背诵计划」里点单词右侧的 ★ 即可加入重点本。</div>` : ''}
          ${toDo.length ? `
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold text-gray-700">待复习 ${toDo.length} 词</h3>
              <button onclick="app.toggleMarkedRevealAll()" class="text-xs text-indigo-600 hover:underline">${allOpen ? '收起全部释义' : '展开全部释义'}</button>
            </div>
            <div class="grid grid-cols-1 gap-2">${toDo.map(w => this.renderReciteCard(w, 'todo')).join('')}</div>
          </div>
          ` : ''}
          ${done.length ? `
          <div>
            <button onclick="app.toggleMarkedDoneCollapse()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-green-50 border border-green-200 text-sm font-medium text-green-700 hover:bg-green-100 transition-colors">
              <span>✓ 已复习 ${done.length} 词（点击${this.recite.markedDoneCollapsed ? '展开' : '收起'}）</span>
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
            ${this.recite.markedDoneCollapsed ? '' : `<div class="grid grid-cols-1 gap-2 mt-2">${done.map(w => this.renderReciteCard(w, 'done')).join('')}</div>`}
          </div>
          ` : ''}
        `;
        lucide.createIcons();
      }

      toggleMark(word) {
        if (this.recite.marked.has(word)) this.recite.marked.delete(word);
        else this.recite.marked.add(word);
        this.saveRecite();
        if (this.view === 'marked') this.renderMarked();
        else this.renderRecite();
      }

      toggleMarkedRevealAll() {
        const all = (window.VOCAB_IELTS || []).filter(w => this.recite.marked.has(w.word));
        const toDo = all.filter(w => !this.recite.checked.has(w.word));
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        toDo.forEach(w => { this.recite.reveal[w.word] = !allOpen; });
        this.renderMarked();
      }

      toggleMarkedDoneCollapse() {
        this.recite.markedDoneCollapsed = !this.recite.markedDoneCollapsed;
        this.saveRecite();
        this.renderMarked();
      }

      gotoDay(d) {
        this.recite.selectedDay = d;
        // 手机上选完某天后自动收起天数云，保持界面清爽（桌面常显不受影响）
        if (window.innerWidth < 768) this.recite.dayCloudOpen = false;
        this.saveRecite();
        this.renderRecite();
      }

      toggleDayCloud() {
        this.recite.dayCloudOpen = !this.recite.dayCloudOpen;
        this.renderRecite();
      }

      renderReciteCard(w, mode) {
        const isDone = mode === 'done';
        const recalled = mode === 'todo' && this.recite.recalled.has(w.word);
        const revealed = !!this.recite.reveal[w.word];
        const isMarked = this.recite.marked.has(w.word);
        let cardCls = 'bg-white border rounded-xl p-4 transition-all ';
        if (isDone) cardCls += 'border-green-300 bg-green-50/40';
        else if (recalled) cardCls += 'border-orange-300 bg-orange-50/50';
        else cardCls += 'border-gray-200';
        const leftBtn = isDone
          ? `<button type="button" onclick="app.recallWord('${this.jsQuote(w.word)}')" class="flex-shrink-0 mt-0.5 px-2.5 py-1 text-xs font-medium text-orange-700 bg-orange-100 hover:bg-orange-200 rounded-lg" title="回撤到待背（说明没记住）">回撤</button>`
          : `<button type="button" onclick="app.toggleReciteCheck('${this.jsQuote(w.word)}')" class="flex-shrink-0 mt-0.5 w-6 h-6 rounded-md border-2 border-gray-300 hover:border-indigo-400 flex items-center justify-center transition-colors" title="标记已背"></button>`;
        const badge = isDone
          ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-green-100 text-green-700">已背</span>'
          : (recalled ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-orange-100 text-orange-700">↩ 回撤·重点</span>' : '');
        const markBtn = `<button type="button" onclick="app.toggleMark('${this.jsQuote(w.word)}')" class="flex-shrink-0 px-2 py-1 text-base leading-none ${isMarked ? 'text-amber-500' : 'text-gray-300 hover:text-amber-400'}" title="${isMarked ? '取消标注（移出重点本）' : '标注为重点（加入重点本）'}">★</button>`;
        return `
          <div class="${cardCls}">
            <div class="flex items-start gap-3">
              ${leftBtn}
              <div class="flex-1 min-w-0 cursor-pointer" onclick="app.toggleReveal('${this.jsQuote(w.word)}')">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-base font-bold text-gray-900">${this.escapeHtml(w.word)}</span>
                  ${w.phon ? `<span class="text-xs text-gray-400">/${this.escapeHtml(w.phon)}/</span>` : ''}
                  ${badge}
                </div>
                <p class="text-sm text-gray-700 mt-1 ${revealed ? '' : 'hidden'}">${this.escapeHtml(w.meaning)}</p>
              </div>
              ${markBtn}
              <button type="button" onclick="app.toggleReveal('${this.jsQuote(w.word)}')" class="flex-shrink-0 px-2.5 py-1 text-xs font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg">
                ${revealed ? '隐藏' : '释义'}
              </button>
            </div>
          </div>
        `;
      }

      toggleReveal(word) {
        this.recite.reveal[word] = !this.recite.reveal[word];
        if (this.view === 'marked') this.renderMarked();
        else this.renderRecite();
      }

      toggleRevealAll() {
        const selWords = this.getDayWords(this.recite.selectedDay || this.todayDayNum());
        const toDo = selWords.filter(w => !this.recite.checked.has(w.word));
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        toDo.forEach(w => { this.recite.reveal[w.word] = !allOpen; });
        this.renderRecite();
      }

      toggleReciteCheck(word) {
        const now = this.nowISO();
        this.recite.checked.add(word);
        this.recite.recalled.delete(word);
        this.recite.checkedAt[word] = this.todayStr();
        this.recite.checkedTs[word] = now;
        delete this.recite.recalledAt[word];
        this.saveRecite();
        this.renderCurrentView();
        this.showUndo(word);
      }

      showUndo(word) {
        this.undoIndex = word;
        const el = document.getElementById('recite-undo');
        const txt = document.getElementById('recite-undo-text');
        if (txt) txt.textContent = `已背「${this.escapeHtml(word)}」· 点错了？`;
        if (el) {
          el.classList.remove('hidden');
          clearTimeout(this.undoTimer);
          // 4 秒内可撤销，足够看清并点击
          this.undoTimer = setTimeout(() => { el.classList.add('hidden'); this.undoIndex = null; }, 4000);
        }
      }

      undoLast() {
        if (this.undoIndex == null) return;
        const w = this.undoIndex;
        this.recite.checked.delete(w);
        delete this.recite.checkedAt[w];
        delete this.recite.checkedTs[w];
        this.recite.recalledAt[w] = this.nowISO();
        this.undoIndex = null;
        this.saveRecite();
        this.renderCurrentView();
        const el = document.getElementById('recite-undo');
        if (el) el.classList.add('hidden');
        clearTimeout(this.undoTimer);
      }

      recallWord(word) {
        this.recite.checked.delete(word);
        delete this.recite.checkedAt[word];
        delete this.recite.checkedTs[word];
        this.recite.recalled.add(word);
        this.recite.recalledAt[word] = this.nowISO();
        this.saveRecite();
        this.renderCurrentView();
      }

      toggleDoneCollapse() {
        this.recite.collapsedDone = !this.recite.collapsedDone;
        this.saveRecite();
        this.renderRecite();
      }

      exportRecite() {
        const data = JSON.stringify({
          words: this.state.words,
          deletedWordIds: Array.from(this.deletedWordIds),
          days: this.recite.days,
          startDate: this.recite.startDate,
          checked: [...this.recite.checked],
          recalled: [...this.recite.recalled],
          marked: [...this.recite.marked],
          checkedAt: this.recite.checkedAt,
          checkedTs: this.recite.checkedTs,
          recalledAt: this.recite.recalledAt,
          selectedDay: this.recite.selectedDay,
          prep: {
            examDate: this.prep.examDate,
            target: this.prep.target,
            currentTotal: this.prep.currentTotal,
            testsTotal: this.prep.testsTotal,
            testsDone: this.prep.testsDone,
            listenBooks: this.prep.listenBooks,
            readBooks: this.prep.readBooks,
            listenDone: [...this.prep.listenDone],
            readDone: [...this.prep.readDone],
            listenDoneAt: this.prep.listenDoneAt,
            readDoneAt: this.prep.readDoneAt,
            listenUndoneAt: this.prep.listenUndoneAt,
            readUndoneAt: this.prep.readUndoneAt,
            listenExpanded: this.prep.listenExpanded,
            readExpanded: this.prep.readExpanded,
            diary: this.prep.diary,
            writingGoal: this.prep.writingGoal,
            writingDone: this.prep.writingDone,
            speakingGoal: this.prep.speakingGoal,
            speakingDone: this.prep.speakingDone,
            daily: this.prep.daily
          }
        }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `单词本全量备份-${this.todayStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      importRecite(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const d = JSON.parse(e.target.result);
            this.recite.days = d.days || 30;
            this.recite.startDate = d.startDate || this.todayStr();
            this.recite.checked = new Set(d.checked || []);
            this.recite.recalled = new Set(d.recalled || []);
            this.recite.marked = new Set(d.marked || []);
            this.recite.checkedAt = d.checkedAt || {};
            this.recite.checkedTs = d.checkedTs || {};
            this.recite.recalledAt = d.recalledAt || {};
            this.recite.selectedDay = d.selectedDay || this.todayDayNum();
            if (d.prep) {
              const rp = d.prep;
              this.prep.examDate = rp.examDate || this.prep.examDate;
              this.prep.target = Object.assign({}, this.prep.target, rp.target || {});
              if (typeof rp.currentTotal === 'number') this.prep.currentTotal = rp.currentTotal;
              if (typeof rp.testsTotal === 'number') this.prep.testsTotal = rp.testsTotal;
              this.prep.testsDone = Object.assign({}, this.prep.testsDone, rp.testsDone || {});
              if (typeof rp.writingGoal === 'number') this.prep.writingGoal = rp.writingGoal;
              if (typeof rp.writingDone === 'number') this.prep.writingDone = rp.writingDone;
              if (typeof rp.speakingGoal === 'number') this.prep.speakingGoal = rp.speakingGoal;
              if (typeof rp.speakingDone === 'number') this.prep.speakingDone = rp.speakingDone;
              this.prep.daily = Object.assign({}, this.prep.daily, rp.daily || {});
              if (Array.isArray(rp.listenBooks) && rp.listenBooks.length) this.prep.listenBooks = rp.listenBooks;
              if (Array.isArray(rp.readBooks) && rp.readBooks.length) this.prep.readBooks = rp.readBooks;
              this.prep.listenDone = new Set();
              this.prep.readDone = new Set();
              this.prep.listenDoneAt = {};
              this.prep.readDoneAt = {};
              this.prep.listenUndoneAt = Object.assign({}, this.prep.listenUndoneAt, rp.listenUndoneAt || {});
              this.prep.readUndoneAt = Object.assign({}, this.prep.readUndoneAt, rp.readUndoneAt || {});
              this.prep.listenExpanded = Object.assign({}, this.prep.listenExpanded, rp.listenExpanded || {});
              this.prep.readExpanded = Object.assign({}, this.prep.readExpanded, rp.readExpanded || {});
              this.prep.diary = Object.assign({}, this.prep.diary, rp.diary || {});
              this.migratePrepDone(rp.listenDone || [], rp.listenDoneAt || {}, 'L');
              this.migratePrepDone(rp.readDone || [], rp.readDoneAt || {}, 'R');
            }
            if (Array.isArray(d.words)) {
              this.state.words = d.words;
              this.saveData();
              this.renderCategories();
              this.render();
            }
            if (Array.isArray(d.deletedWordIds)) {
              d.deletedWordIds.forEach(id => { if (id) this.deletedWordIds.add(id); });
              this.saveDeletedWords();
              this.state.words = this.state.words.filter(w => !this.deletedWordIds.has(w.id));
            }
            this.saveRecite();
            this.savePrep();
            this.renderCurrentView();
            alert(`导入成功：${Array.isArray(d.words) ? d.words.length : 0} 个单词 · 背诵 ${(d.checked || []).length} 词 · ${d.prep ? '备考设置' : '（无备考数据）'}`);
          } catch (err) {
            alert('导入失败：' + err.message);
          }
        };
        reader.readAsText(file);
        input.value = '';
      }

      resetRecite() {
        if (!confirm('确定清空所有打卡记录吗？词表保留，仅清除「已背」标记。')) return;
        this.recite.checked = new Set();
        this.recite.recalled = new Set();
        this.saveRecite();
        this.renderRecite();
      }

      // ===== Cloud Sync (GitHub) =====
      syncEnabled() {
        const c = this.loadSyncCfg();
        return !!(c.enabled && c.token);
      }
      loadSyncCfg() {
        try { return JSON.parse(localStorage.getItem('wordbook_sync_cfg')) || {}; } catch (e) { return {}; }
      }
      saveSyncCfg(cfg) {
        localStorage.setItem('wordbook_sync_cfg', JSON.stringify(cfg));
      }
      nowHM() {
        const d = new Date();
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      nowISO() {
        return new Date().toISOString();
      }
      dateFromIso(iso) {
        if (!iso) return '';
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return '';
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        } catch (e) { return ''; }
      }
      updateSyncStatus(text, type) {
        const cls = { ok: 'bg-green-50 text-green-700', err: 'bg-red-50 text-red-700', idle: 'bg-gray-100 text-gray-500', syncing: 'bg-indigo-50 text-indigo-700' };
        const el = document.getElementById('sync-status');
        if (el) {
          el.className = 'text-xs px-2 py-1 rounded-full ' + (cls[type] || cls.idle);
          el.textContent = text;
        }
        const dot = document.getElementById('sidebar-sync-dot');
        if (dot) {
          const dotCls = { ok: 'bg-green-500', err: 'bg-red-500', idle: 'bg-gray-300', syncing: 'bg-indigo-500 animate-pulse' };
          dot.className = 'w-2 h-2 rounded-full ' + (dotCls[type] || dotCls.idle);
        }
      }
      async ghFetch(method, path, body) {
        const c = this.loadSyncCfg();
        return fetch('https://api.github.com' + path, {
          method: method,
          headers: {
            Authorization: 'Bearer ' + (c.token || ''),
            'Content-Type': 'application/json',
            Accept: 'application/vnd.github+json'
          },
          body: body ? JSON.stringify(body) : undefined
        });
      }
      async ensureSyncRepo() {
        const c = this.loadSyncCfg();
        const repoPath = '/repos/' + c.owner + '/' + c.repo;
        let res = await this.ghFetch('GET', repoPath);
        if (res.status === 200) return true;
        if (res.status === 404) {
          res = await this.ghFetch('POST', '/user/repos', {
            name: c.repo, private: true,
            description: '单词本背诵进度云同步（自动创建）', auto_init: false
          });
          if (res.status === 201 || res.status === 200 || res.status === 422) return true;
          throw new Error('创建仓库失败：HTTP ' + res.status);
        }
        throw new Error('仓库检查失败：HTTP ' + res.status);
      }
      serializeRecite() {
        return {
          days: this.recite.days,
          startDate: this.recite.startDate,
          checked: Array.from(this.recite.checked),
          recalled: Array.from(this.recite.recalled),
          marked: Array.from(this.recite.marked),
          checkedAt: this.recite.checkedAt,
          checkedTs: this.recite.checkedTs,
          recalledAt: this.recite.recalledAt,
          selectedDay: this.recite.selectedDay,
          prep: {
            examDate: this.prep.examDate,
            target: this.prep.target,
            currentTotal: this.prep.currentTotal,
            testsTotal: this.prep.testsTotal,
            testsDone: this.prep.testsDone,
            listenBooks: this.prep.listenBooks,
            readBooks: this.prep.readBooks,
            listenDone: Array.from(this.prep.listenDone),
            readDone: Array.from(this.prep.readDone),
            listenDoneAt: this.prep.listenDoneAt,
            readDoneAt: this.prep.readDoneAt,
            listenUndoneAt: this.prep.listenUndoneAt,
            readUndoneAt: this.prep.readUndoneAt,
            listenExpanded: this.prep.listenExpanded,
            readExpanded: this.prep.readExpanded,
            diary: this.prep.diary,
            writingGoal: this.prep.writingGoal,
            writingDone: this.prep.writingDone,
            speakingGoal: this.prep.speakingGoal,
            speakingDone: this.prep.speakingDone,
            daily: this.prep.daily
          },
          words: this.state.words,
          deletedWordIds: Array.from(this.deletedWordIds)
        };
      }

      // 合并远程数据：进度类只增不减（并集/取 max），设置类以"较新的一方"为准
      mergeRemote(remote) {
        if (!remote || typeof remote !== 'object') return;
        const localUpd = this._lastUpdatedAt || 0;
        let remoteUpd = 0;
        if (remote.updatedAt) {
          const t = new Date(remote.updatedAt).getTime();
          if (!isNaN(t)) remoteUpd = t;
        }
        const remoteNewer = remoteUpd > localUpd;
        // —— 背诵进度：按每个词的时间戳「最后写入者胜」——
        if (Array.isArray(remote.marked)) remote.marked.forEach(w => this.recite.marked.add(w));
        const remoteChecked = new Set(remote.checked || []);
        const remoteRecalled = new Set(remote.recalled || []);
        const remoteCheckedTs = remote.checkedTs || {};
        const remoteRecalledAt = remote.recalledAt || {};
        const remoteCheckedAt = remote.checkedAt || {};
        const allWords = new Set([
          ...this.recite.checked, ...this.recite.recalled,
          ...remoteChecked, ...remoteRecalled,
          ...Object.keys(this.recite.checkedTs), ...Object.keys(this.recite.recalledAt),
          ...Object.keys(remoteCheckedTs), ...Object.keys(remoteRecalledAt)
        ]);
        const ts = (v) => { const t = v ? new Date(v).getTime() : 0; return isNaN(t) ? 0 : t; };
        for (const w of allWords) {
          const localCheckedTs = ts(this.recite.checkedTs[w]);
          const localRecalledTs = ts(this.recite.recalledAt[w]);
          const remoteCheckedTs_ = ts(remoteCheckedTs[w]);
          const remoteRecalledTs_ = ts(remoteRecalledAt[w]);
          const localLast = Math.max(localCheckedTs, localRecalledTs);
          const remoteLast = Math.max(remoteCheckedTs_, remoteRecalledTs_);
          if (remoteLast > localLast) {
            if (remoteCheckedTs_ >= remoteRecalledTs_) {
              this.recite.checked.add(w); this.recite.recalled.delete(w);
              this.recite.checkedTs[w] = remoteCheckedTs[w];
              this.recite.checkedAt[w] = this.dateFromIso(remoteCheckedTs[w]) || remoteCheckedAt[w] || this.todayStr();
              delete this.recite.recalledAt[w];
            } else {
              this.recite.checked.delete(w); this.recite.recalled.add(w);
              delete this.recite.checkedAt[w]; delete this.recite.checkedTs[w];
              this.recite.recalledAt[w] = remoteRecalledAt[w];
            }
          } else if (remoteLast === localLast && remoteLast === 0) {
            // 旧数据无时间戳：按成员关系兜底
            if (remoteRecalled.has(w)) {
              this.recite.checked.delete(w); this.recite.recalled.add(w);
              delete this.recite.checkedAt[w]; delete this.recite.checkedTs[w];
              if (remoteRecalledAt[w]) this.recite.recalledAt[w] = remoteRecalledAt[w];
            } else if (remoteChecked.has(w)) {
              this.recite.checked.add(w); this.recite.recalled.delete(w);
              this.recite.checkedAt[w] = remoteCheckedAt[w] || this.recite.checkedAt[w] || this.todayStr();
              if (remoteCheckedTs[w]) this.recite.checkedTs[w] = remoteCheckedTs[w];
            }
          }
        }
        // —— 计划设置（天数/开始日/选中日）：较新端优先 ——
        if (remoteNewer) {
          if (remote.days) this.recite.days = remote.days;
          if (remote.startDate) this.recite.startDate = remote.startDate;
          if (remote.selectedDay) this.recite.selectedDay = remote.selectedDay;
        }
        // —— 备考计划 ——
        if (remote.prep && typeof remote.prep === 'object') {
          const rp = remote.prep;
          // 兼容旧版远程数据：把 L-9-T1 这种 Test 粒度展开为 L-9-1-1..4 小节粒度
          this.migrateRemotePrep(rp, 'L');
          this.migrateRemotePrep(rp, 'R');
          if (remoteNewer) {
            if (rp.examDate) this.prep.examDate = rp.examDate;
            this.prep.target = Object.assign({}, this.prep.target, rp.target || {});
            if (typeof rp.currentTotal === 'number') this.prep.currentTotal = rp.currentTotal;
            if (typeof rp.testsTotal === 'number') this.prep.testsTotal = rp.testsTotal;
            if (typeof rp.writingGoal === 'number') this.prep.writingGoal = rp.writingGoal;
            if (typeof rp.speakingGoal === 'number') this.prep.speakingGoal = rp.speakingGoal;
          }
          // 进度类：取 max（只增不减）
          if (rp.testsDone && typeof rp.testsDone === 'object') {
            this.prep.testsDone.L = Math.max(this.prep.testsDone.L || 0, rp.testsDone.L || 0);
            this.prep.testsDone.R = Math.max(this.prep.testsDone.R || 0, rp.testsDone.R || 0);
          }
          if (typeof rp.writingDone === 'number') this.prep.writingDone = Math.max(this.prep.writingDone || 0, rp.writingDone);
          if (typeof rp.speakingDone === 'number') this.prep.speakingDone = Math.max(this.prep.speakingDone || 0, rp.speakingDone);
          if (rp.daily && typeof rp.daily === 'object') Object.assign(this.prep.daily, rp.daily);
          // 真题打卡：按每个小节的时间戳「最后写入者胜」
          this.mergeTimestampDone(
            this.prep.listenDone, this.prep.listenDoneAt, this.prep.listenUndoneAt,
            rp.listenDone, rp.listenDoneAt, rp.listenUndoneAt
          );
          this.mergeTimestampDone(
            this.prep.readDone, this.prep.readDoneAt, this.prep.readUndoneAt,
            rp.readDone, rp.readDoneAt, rp.readUndoneAt
          );
          // 日记（较新端优先）
          if (rp.diary && typeof rp.diary === 'object') {
            for (const [day, entry] of Object.entries(rp.diary)) {
              const local = this.prep.diary[day];
              if (!local || (entry && entry.updatedAt && (!local.updatedAt || entry.updatedAt > local.updatedAt))) {
                this.prep.diary[day] = Object.assign({}, local, entry);
              }
            }
          }
          // 书籍范围（设置类：较新端优先）
          if (remoteNewer) {
            if (Array.isArray(rp.listenBooks) && rp.listenBooks.length) this.prep.listenBooks = rp.listenBooks;
            if (Array.isArray(rp.readBooks) && rp.readBooks.length) this.prep.readBooks = rp.readBooks;
          }
        }
        // —— 单词本（按 id 并集 + 最后修改优先 + 墓碑删除）——
        if (Array.isArray(remote.words)) {
          const map = {};
          this.state.words.forEach(w => { if (w && w.id) map[w.id] = w; });
          remote.words.forEach(w => {
            if (!w || !w.id) return;
            const local = map[w.id];
            const rw = w.updatedAt || w.createdAt || '0';
            const lw = local ? (local.updatedAt || local.createdAt || '0') : '0';
            if (!local || rw >= lw) map[w.id] = w; // 远程更新或新增则覆盖/加入
          });
          this.state.words = Object.keys(map).map(id => map[id]);
        }
        if (Array.isArray(remote.deletedWordIds)) {
          remote.deletedWordIds.forEach(id => { if (id) this.deletedWordIds.add(id); });
        }
        // 应用墓碑：移除两端都已标记删除的词
        if (this.deletedWordIds.size) {
          this.state.words = this.state.words.filter(w => !this.deletedWordIds.has(w.id));
        }
        this._lastUpdatedAt = Math.max(localUpd, remoteUpd);
      }

      // 手动「立即同步」：先拉取合并，再推送，并弹提示确认完成
      async syncNow() {
        if (!this.syncEnabled()) {
          this.updateSyncStatus('未启用云同步', 'idle');
          this.showToast('未启用云同步：请到侧栏「云端同步」配置');
          return;
        }
        this.updateSyncStatus('同步中…', 'syncing');
        await this.pullRecite();
        await this.pushRecite(true);
        this.showToast('✅ 已同步 ' + this.nowHM());
      }

      showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
      }

      // 数据指纹：用于无变化时跳过推送，省流量
      hashStr(s) {
        let h = 5381;
        for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
        return (h >>> 0).toString(16);
      }
      dataFingerprint() {
        try { return this.hashStr(JSON.stringify(this.serializeRecite())); } catch (e) { return '0'; }
      }
      setPushedFp() {
        this._lastPushedFp = this.dataFingerprint();
        try { localStorage.setItem('wordbook_sync_fp', this._lastPushedFp); } catch (e) {}
      }
      async pushRecite(force) {
        if (!this.syncEnabled()) return;
        // 去重：数据与上次推送一致则跳过，避免重复 GET+PUT 浪费流量
        if (!force) {
          const fp = this.dataFingerprint();
          if (fp && fp === this._lastPushedFp) {
            this.updateSyncStatus('已是最新', 'ok');
            return;
          }
        }
        this.updateSyncStatus('同步中…', 'syncing');
        try {
          const c = this.loadSyncCfg();
          const filePath = '/repos/' + c.owner + '/' + c.repo + '/contents/' + c.path;
          // 先拉取远程并合并（防止滞后端覆盖先进端；进度类只增不减）
          let sha = null;
          const head = await this.ghFetch('GET', filePath);
          if (head.status === 200) {
            const j = await head.json();
            sha = j.sha;
            const remote = JSON.parse(base64ToUtf8(j.content));
            this.mergeRemote(remote);
          }
          const now = new Date().toISOString();
          const content = JSON.stringify(Object.assign({}, this.serializeRecite(), { updatedAt: now }), null, 2);
          const body = { message: 'sync recite + prep progress', content: utf8ToBase64(content) };
          if (sha) body.sha = sha;
          let res = await this.ghFetch('PUT', filePath, body);
          // 409 = 我读取后远程刚被另一设备改写 → 重新拉取合并再推一次
          if (res.status === 409) {
            const head2 = await this.ghFetch('GET', filePath);
            if (head2.status === 200) {
              const j2 = await head2.json();
              this.mergeRemote(JSON.parse(base64ToUtf8(j2.content)));
              const content2 = JSON.stringify(Object.assign({}, this.serializeRecite(), { updatedAt: new Date().toISOString() }), null, 2);
              res = await this.ghFetch('PUT', filePath, { message: 'sync retry after conflict', content: utf8ToBase64(content2), sha: j2.sha });
            }
          }
          if (res.status === 200 || res.status === 201) {
            this._lastUpdatedAt = new Date(now).getTime();
            this.updateSyncStatus('已同步 ' + this.nowHM(), 'ok');
            this.setPushedFp();
            this.saveData();
            this.saveDeletedWords();
            this.renderCurrentView();
          } else {
            this.updateSyncStatus('同步失败 ' + res.status, 'err');
          }
        } catch (e) {
          this.updateSyncStatus('同步失败', 'err');
        }
      }
      async pullRecite() {
        if (!this.syncEnabled()) return;
        try {
          const c = this.loadSyncCfg();
          const filePath = '/repos/' + c.owner + '/' + c.repo + '/contents/' + c.path;
          const res = await this.ghFetch('GET', filePath);
          if (res.status !== 200) return;
          const j = await res.json();
          this.mergeRemote(JSON.parse(base64ToUtf8(j.content)));
          this.setPushedFp();
          this.saveRecite();
          this.savePrep();
          this.saveData();
          this.saveDeletedWords();
          // 关键修复：同步后重渲染「当前视图」（含单词本），否则手机端切到单词本看不到刚同步的词
          this.renderCurrentView();
          this.updateSyncStatus('已同步 ' + this.nowHM(), 'ok');
        } catch (e) {
          // 拉取失败不阻断本地使用
        }
      }
      scheduleSyncPush() {
        if (!this.syncEnabled()) return;
        clearTimeout(this._syncTimer);
        this._syncTimer = setTimeout(() => this.pushRecite(), 1500);
      }
      // 抽屉（手机侧栏）
      toggleDrawer() {
        const aside = document.getElementById('app-aside');
        const overlay = document.getElementById('drawer-overlay');
        if (!aside) return;
        const open = aside.classList.contains('-translate-x-full');
        aside.classList.toggle('-translate-x-full');
        aside.classList.toggle('translate-x-0');
        if (overlay) overlay.classList.toggle('hidden', !open);
      }
      closeDrawer() {
        const aside = document.getElementById('app-aside');
        const overlay = document.getElementById('drawer-overlay');
        if (aside) { aside.classList.add('-translate-x-full'); aside.classList.remove('translate-x-0'); }
        if (overlay) overlay.classList.add('hidden');
      }
      // 勾选框即时响应：取消勾选 -> 立即关闭并保存；勾选 -> 需填 Token 后点「保存并测试」
      onToggleSync(checked) {
        const msg = document.getElementById('sync-msg');
        if (!checked) {
          const c = this.loadSyncCfg();
          this.saveSyncCfg(Object.assign({}, c, { enabled: false }));
          this.updateSyncStatus('未启用云同步', 'idle');
          if (msg) msg.innerHTML = '<span class="text-gray-500">已关闭自动同步（已保存）</span>';
        } else {
          if (msg) msg.innerHTML = '<span class="text-amber-600">请填写 Token 后点「保存并测试」以启用</span>';
        }
      }
      // 云同步设置弹窗
      openSync() {
        const c = this.loadSyncCfg();
        document.getElementById('sync-enabled').checked = !!c.enabled;
        document.getElementById('sync-token').value = c.token || '';
        document.getElementById('sync-owner').value = c.owner || 'litostar';
        document.getElementById('sync-repo').value = c.repo || 'wordbook-sync';
        document.getElementById('sync-msg').textContent = '';
        document.getElementById('sync-modal').classList.remove('hidden');
        document.getElementById('sync-modal').classList.add('flex');
        lucide.createIcons();
      }
      closeSync() {
        document.getElementById('sync-modal').classList.add('hidden');
        document.getElementById('sync-modal').classList.remove('flex');
      }
      toggleTokenVisible() {
        const inp = document.getElementById('sync-token');
        inp.type = inp.type === 'password' ? 'text' : 'password';
      }
      async saveSyncSettings() {
        const enabled = document.getElementById('sync-enabled').checked;
        const token = document.getElementById('sync-token').value.trim();
        const owner = document.getElementById('sync-owner').value.trim() || 'litostar';
        const repo = document.getElementById('sync-repo').value.trim() || 'wordbook-sync';
        const msg = document.getElementById('sync-msg');
        if (enabled && !token) { msg.innerHTML = '<span class="text-red-600">启用同步需要填写 Token</span>'; return; }
        this.saveSyncCfg({ enabled: enabled, token: token, owner: owner, repo: repo, path: 'recite_progress.json' });
        if (!enabled) {
          this.updateSyncStatus('未启用云同步', 'idle');
          msg.innerHTML = '<span class="text-gray-500">已关闭自动同步（已保存）</span>';
          return;
        }
        msg.innerHTML = '<span class="text-gray-500">正在测试连接…</span>';
        try {
          await this.ensureSyncRepo();
          await this.pullRecite();
          await this.pushRecite();
          msg.innerHTML = '<span class="text-green-600">✓ 同步已启用并测试成功</span>';
          this.updateSyncStatus('已同步 ' + this.nowHM(), 'ok');
        } catch (e) {
          msg.innerHTML = '<span class="text-red-600">连接失败：' + this.escapeHtml(e.message) + '</span>';
          this.updateSyncStatus('同步失败', 'err');
        }
      }
      async manualSync() {
        const msg = document.getElementById('sync-msg');
        try {
          await this.pullRecite();
          await this.pushRecite();
          if (msg) msg.innerHTML = '<span class="text-green-600">✓ 同步完成</span>';
        } catch (e) {
          if (msg) msg.innerHTML = '<span class="text-red-600">同步失败：' + this.escapeHtml(e.message) + '</span>';
        }
      }
      disconnectSync() {
        if (!confirm('断开云同步？本机进度保留，但不再自动上传/下载。')) return;
        const c = this.loadSyncCfg();
        this.saveSyncCfg(Object.assign({}, c, { enabled: false }));
        this.updateSyncStatus('未启用云同步', 'idle');
        this.closeSync();
      }

      loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            this.state.words = JSON.parse(raw);
          } else {
            this.state.words = [...DEFAULT_WORDS];
            this.saveData();
          }
          // 加载删除墓碑（跨端同步删除用）
          try {
            const dr = localStorage.getItem('wordbook_deleted_words_v1');
            if (dr) JSON.parse(dr).forEach(id => this.deletedWordIds.add(id));
          } catch (e) {}
          // 过滤掉已被删除的词（本地视图一致）
          this.state.words = this.state.words.filter(w => !this.deletedWordIds.has(w.id));
        } catch (e) {
          this.state.words = [...DEFAULT_WORDS];
        }
      }

      saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state.words));
      }

      saveDeletedWords() {
        try { localStorage.setItem('wordbook_deleted_words_v1', JSON.stringify(Array.from(this.deletedWordIds))); } catch (e) {}
      }

      setCategory(cat) {
        this.state.category = cat;
        // 联动添加表单的分类下拉框
        const sel = document.getElementById('input-category');
        if (sel && cat !== 'all') sel.value = cat;
        this.renderCategories();
        this.render();
        this.closeDrawer();
      }

      setSearch(val) {
        this.state.search = val.trim().toLowerCase();
        this.render();
      }

      getFilteredWords() {
        return this.state.words.filter(w => {
          const catMatch = this.state.category === 'all' || w.category === this.state.category;
          const searchMatch = !this.state.search ||
            w.word.toLowerCase().includes(this.state.search) ||
            w.meaning.toLowerCase().includes(this.state.search) ||
            (w.note && w.note.toLowerCase().includes(this.state.search));
          return catMatch && searchMatch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date) || new Date(b.createdAt) - new Date(a.createdAt));
      }

      groupByDate(words) {
        const groups = {};
        words.forEach(w => {
          if (!groups[w.date]) groups[w.date] = [];
          groups[w.date].push(w);
        });
        return Object.entries(groups).sort((a, b) => new Date(b[0]) - new Date(a[0]));
      }

      renderCategories() {
        const counts = { all: this.state.words.length };
        Object.keys(CATEGORIES).forEach(c => counts[c] = this.state.words.filter(w => w.category === c).length);

        Object.keys(CATEGORIES).forEach(cat => {
          document.getElementById(`count-${cat}`).textContent = counts[cat];
        });
        document.getElementById('count-all').textContent = counts.all;

        document.querySelectorAll('.cat-btn').forEach(btn => {
          btn.className = 'cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left text-gray-600 hover:bg-gray-50';
        });

        const active = document.getElementById(`cat-${this.state.category}`);
        if (active) {
          active.className = 'cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left bg-indigo-50 text-indigo-700';
        }

        const catInfo = CATEGORIES[this.state.category];
        document.getElementById('page-title').textContent = this.state.category === 'all' ? '全部单词' : `${catInfo.name}单词`;
      }

      render() {
        const filtered = this.getFilteredWords();
        const container = document.getElementById('word-list');

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-16 text-gray-400 fade-in">
              <i data-lucide="book-x" class="w-12 h-12 mb-3 text-gray-300"></i>
              <p class="text-sm">暂无单词，添加一个吧</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        const groups = this.groupByDate(filtered);
        container.innerHTML = groups.map(([date, words]) => `
          <div class="fade-in">
            <div class="flex items-center gap-3 mb-3">
              <h3 class="text-sm font-bold text-gray-700">${formatDate(date)}</h3>
              <div class="flex-1 h-px bg-gray-200"></div>
              <span class="text-xs text-gray-400">${words.length} 个</span>
            </div>
            <div class="grid grid-cols-1 gap-2">
              ${words.map(w => this.renderWordCard(w)).join('')}
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      }

      renderWordCard(w) {
        const cat = CATEGORIES[w.category];
        const isSelected = this.state.selectedIds.has(w.id);

        if (this.state.selectMode) {
          return `
            <div onclick="app.toggleSelect('${w.id}')" class="group bg-white border rounded-xl p-4 transition-all cursor-pointer ${isSelected ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-gray-200 hover:border-indigo-200'}">
              <div class="flex items-start gap-3">
                <div class="flex-shrink-0 pt-0.5">
                  <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition-colors ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'border-gray-300 group-hover:border-indigo-400'}">
                    ${isSelected ? '<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
                  </div>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="text-base font-bold text-gray-900">${this.escapeHtml(w.word)}</span>
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-${cat.color}-50 text-${cat.color}-600">
                      <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                      ${cat.name}
                    </span>
                    ${w.mastered ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-green-50 text-green-600">已掌握</span>' : ''}
                  </div>
                  <p class="text-sm text-gray-700">${this.escapeHtml(w.meaning)}</p>
                  ${w.note ? `<p class="text-xs text-gray-500 mt-1.5 line-clamp-2">${this.escapeHtml(w.note)}</p>` : ''}
                  ${this.renderSynonyms(w)}
                </div>
              </div>
            </div>
          `;
        }

        return `
          <div onclick="app.openEdit('${w.id}')" class="group bg-white border border-gray-200 rounded-xl p-4 hover:shadow-md hover:border-indigo-200 transition-all cursor-pointer">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="text-base font-bold text-gray-900">${this.escapeHtml(w.word)}</span>
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-${cat.color}-50 text-${cat.color}-600">
                    <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                    ${cat.name}
                  </span>
                  ${w.mastered ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-green-50 text-green-600">已掌握</span>' : ''}
                </div>
                <p class="text-sm text-gray-700">${this.escapeHtml(w.meaning)}</p>
                ${w.note ? `<p class="text-xs text-gray-500 mt-1.5 line-clamp-2">${this.escapeHtml(w.note)}</p>` : ''}
                ${this.renderSynonyms(w)}
              </div>
              <div class="flex flex-col gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                <button type="button" onclick="event.stopPropagation(); app.toggleMastered('${w.id}')" class="p-1.5 text-gray-400 hover:text-green-600 hover:bg-green-50 rounded-lg" title="标记掌握">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      jsQuote(text) {
        return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
      }

      addWord(e) {
        e.preventDefault();
        const word = document.getElementById('input-word').value.trim();
        const meaning = document.getElementById('input-meaning').value.trim();
        const note = document.getElementById('input-note').value.trim();
        const date = document.getElementById('input-date').value;
        const category = document.getElementById('input-category').value;

        if (!word || !meaning || !date) return;

        // 读取同义词辨析（可选）
        const synonyms = [];
        document.querySelectorAll('#synonym-rows .syn-row').forEach(row => {
          const sw = row.querySelector('.syn-word').value.trim();
          const sm = row.querySelector('.syn-mean').value.trim();
          if (sw) synonyms.push({ word: sw, meaning: sm });
        });

        this.state.words.unshift({
          id: generateId(),
          word,
          meaning,
          note,
          category,
          date,
          synonyms,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          mastered: false
        });

        this.saveData();
        this.scheduleSyncPush();
        document.getElementById('input-word').value = '';
        document.getElementById('input-meaning').value = '';
        document.getElementById('input-note').value = '';
        const synBox = document.getElementById('synonym-rows');
        if (synBox) synBox.innerHTML = '';
        this.renderCategories();
        this.render();
      }

      addSynonymRow(word = '', meaning = '') {
        const box = document.getElementById('synonym-rows');
        if (!box) return;
        const row = document.createElement('div');
        row.className = 'syn-row flex gap-2 items-center';
        row.innerHTML = `
          <input type="text" class="syn-word flex-1 px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="近义词（如 adapt）" autocomplete="off">
          <input type="text" class="syn-mean flex-1 px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="释义（如 适应）" autocomplete="off">
          <button type="button" onclick="this.closest('.syn-row').remove()" class="flex-shrink-0 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg" title="删除此条"><i data-lucide="x" class="w-4 h-4"></i></button>
        `;
        box.appendChild(row);
        if (word) row.querySelector('.syn-word').value = word;
        if (meaning) row.querySelector('.syn-mean').value = meaning;
        lucide.createIcons();
      }

      addEditSynonymRow(word = '', meaning = '') {
        const box = document.getElementById('edit-synonym-rows');
        if (!box) return;
        const row = document.createElement('div');
        row.className = 'syn-row flex gap-2 items-center';
        row.innerHTML = `
          <input type="text" class="syn-word flex-1 px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="近义词（如 adapt）" autocomplete="off">
          <input type="text" class="syn-mean flex-1 px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="释义（如 适应）" autocomplete="off">
          <button type="button" onclick="this.closest('.syn-row').remove()" class="flex-shrink-0 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg" title="删除此条"><i data-lucide="x" class="w-4 h-4"></i></button>
        `;
        box.appendChild(row);
        if (word) row.querySelector('.syn-word').value = word;
        if (meaning) row.querySelector('.syn-mean').value = meaning;
        lucide.createIcons();
      }

      renderSynonyms(w) {
        if (!w.synonyms || !w.synonyms.length) return '';
        return `
          <div class="mt-2 pt-2 border-t border-gray-100">
            <div class="text-xs font-semibold text-gray-400 mb-1">同义词辨析</div>
            <ul class="space-y-0.5">
              ${w.synonyms.map(s => `<li class="text-xs text-gray-600"><span class="font-medium text-gray-700">${this.escapeHtml(s.word)}</span>${s.meaning ? ' · ' + this.escapeHtml(s.meaning) : ''}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      toggleMastered(id) {
        const w = this.state.words.find(x => x.id === id);
        if (w) {
          w.mastered = !w.mastered;
          this.saveData();
          this.render();
        }
      }

      // ===== Select Mode =====

      toggleSelectMode() {
        this.state.selectMode = !this.state.selectMode;
        if (!this.state.selectMode) {
          this.state.selectedIds.clear();
        }
        this.updateSelectUI();
        this.render();
      }

      updateSelectUI() {
        const toolbar = document.getElementById('select-toolbar');
        const batchBar = document.getElementById('batch-bar');
        const btn = document.getElementById('btn-select-mode');

        if (this.state.selectMode) {
          toolbar.classList.remove('hidden');
          toolbar.classList.add('flex');
          btn.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-300');
          btn.classList.remove('border-gray-200', 'text-gray-600');
          batchBar.classList.remove('hidden');
        } else {
          toolbar.classList.add('hidden');
          toolbar.classList.remove('flex');
          btn.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-300');
          btn.classList.add('border-gray-200');
          batchBar.classList.add('hidden');
        }
        this.updateSelectCount();
      }

      toggleSelect(id) {
        if (this.state.selectedIds.has(id)) {
          this.state.selectedIds.delete(id);
        } else {
          this.state.selectedIds.add(id);
        }
        this.updateSelectCount();
        this.render();
      }

      selectAll() {
        const filtered = this.getFilteredWords();
        filtered.forEach(w => this.state.selectedIds.add(w.id));
        this.updateSelectCount();
        this.render();
      }

      deselectAll() {
        this.state.selectedIds.clear();
        this.updateSelectCount();
        this.render();
      }

      updateSelectCount() {
        const count = this.state.selectedIds.size;
        document.getElementById('select-count').textContent = `已选 ${count} 个`;
        document.getElementById('batch-count').textContent = count;
      }

      batchDelete() {
        if (this.state.selectedIds.size === 0) return;
        if (!confirm(`确定删除选中的 ${this.state.selectedIds.size} 个单词吗？此操作不可恢复。`)) return;
        this.state.words = this.state.words.filter(w => !this.state.selectedIds.has(w.id));
        this.state.selectedIds.clear();
        this.saveData();
        this.toggleSelectMode();
        this.renderCategories();
        this.render();
      }

      batchMove() {
        const targetCat = document.getElementById('batch-move-category').value;
        if (!targetCat) {
          alert('请先选择目标分类');
          return;
        }
        if (this.state.selectedIds.size === 0) return;
        this.state.words.forEach(w => {
          if (this.state.selectedIds.has(w.id)) {
            w.category = targetCat;
          }
        });
        this.saveData();
        document.getElementById('batch-move-category').value = '';
        this.state.selectedIds.clear();
        this.toggleSelectMode();
        this.renderCategories();
        this.render();
      }

      batchExport() {
        if (this.state.selectedIds.size === 0) return;
        const selected = this.state.words.filter(w => this.state.selectedIds.has(w.id));
        const data = JSON.stringify(selected, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `单词本-选中-${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      // ===== Bulk Import =====

      openBulkImport() {
        document.getElementById('bulk-date').valueAsDate = new Date();
        if (this.state.category !== 'all') {
          document.getElementById('bulk-category').value = this.state.category;
        }
        document.getElementById('bulk-text').value = '';
        document.getElementById('bulk-preview').classList.add('hidden');
        document.getElementById('btn-confirm-import').disabled = true;
        document.getElementById('bulk-import-modal').classList.remove('hidden');
        document.getElementById('bulk-import-modal').classList.add('flex');
        lucide.createIcons();
        setTimeout(() => document.getElementById('bulk-text').focus(), 100);
      }

      closeBulkImport() {
        document.getElementById('bulk-import-modal').classList.add('hidden');
        document.getElementById('bulk-import-modal').classList.remove('flex');
        this.bulkParsed = [];
      }

      parseBulkText() {
        const text = document.getElementById('bulk-text').value.trim();
        if (!text) {
          alert('请先粘贴单词文本');
          return;
        }

        const lines = text.split('\n').filter(l => l.trim());
        this.bulkParsed = lines.map(line => {
          const trimmed = line.trim();
          let parts;

          // Try different separators in priority order
          if (trimmed.includes('\t')) {
            parts = trimmed.split('\t');
          } else if (trimmed.includes(' | ')) {
            parts = trimmed.split(' | ');
          } else if (trimmed.includes('|')) {
            parts = trimmed.split('|');
          } else if (trimmed.includes(' — ')) {
            parts = trimmed.split(' — ');
          } else if (trimmed.includes(' - ')) {
            parts = trimmed.split(' - ');
          } else if (trimmed.includes('：')) {
            parts = trimmed.split('：');
          } else if (trimmed.includes(': ')) {
            parts = trimmed.split(': ');
          } else {
            // No recognized separator, try space
            const spaceIdx = trimmed.indexOf(' ');
            if (spaceIdx > 0) {
              parts = [trimmed.slice(0, spaceIdx), trimmed.slice(spaceIdx + 1)];
            } else {
              parts = [trimmed];
            }
          }

          // Clean up parts
          parts = parts.map(p => p.trim()).filter(p => p);
          const word = parts[0] || '';
          const meaning = parts[1] || '';
          const note = parts[2] || '';

          return { word, meaning, note };
        }).filter(w => w.word);

        // Render preview
        const previewDiv = document.getElementById('bulk-preview');
        const previewList = document.getElementById('preview-list');
        document.getElementById('preview-count').textContent = this.bulkParsed.length;

        if (this.bulkParsed.length === 0) {
          previewList.innerHTML = '<div class="p-3 text-sm text-gray-400">未解析到有效单词</div>';
        } else {
          previewList.innerHTML = this.bulkParsed.map((w, i) => `
            <div class="p-3 flex items-center gap-3 hover:bg-gray-50">
              <span class="text-xs text-gray-400 w-6 flex-shrink-0">${i + 1}</span>
              <span class="text-sm font-medium text-gray-900 flex-shrink-0 min-w-0 truncate">${this.escapeHtml(w.word)}</span>
              <span class="text-sm text-gray-600 flex-1 min-w-0 truncate">${this.escapeHtml(w.meaning) || '<span class="text-red-400">（缺释义）</span>'}</span>
              ${w.note ? `<span class="text-xs text-gray-400 truncate flex-shrink-0">${this.escapeHtml(w.note)}</span>` : ''}
            </div>
          `).join('');
        }

        previewDiv.classList.remove('hidden');
        document.getElementById('btn-confirm-import').disabled = this.bulkParsed.length === 0;
        lucide.createIcons();
      }

      confirmBulkImport() {
        if (this.bulkParsed.length === 0) return;
        const category = document.getElementById('bulk-category').value;
        const date = document.getElementById('bulk-date').value;
        if (!date) {
          alert('请选择日期');
          return;
        }

        this.bulkParsed.forEach((w, i) => {
          this.state.words.unshift({
            id: generateId() + '_' + i,
            word: w.word,
            meaning: w.meaning,
            note: w.note,
            category,
            date,
            createdAt: new Date(Date.now() + i).toISOString(),
            updatedAt: new Date(Date.now() + i).toISOString(),
            mastered: false
          });
        });

        const count = this.bulkParsed.length;
        this.saveData();
        this.scheduleSyncPush();
        this.closeBulkImport();
        this.renderCategories();
        this.render();
        alert(`成功导入 ${count} 个单词`);
      }

      // ===== Edit Modal =====

      openEdit(id) {
        const w = this.state.words.find(x => x.id === id);
        if (!w) return;
        this.editingId = id;
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-category').value = w.category;
        document.getElementById('edit-word').value = w.word;
        document.getElementById('edit-meaning').value = w.meaning;
        document.getElementById('edit-note').value = w.note || '';
        document.getElementById('edit-date').value = w.date;
        const ebox = document.getElementById('edit-synonym-rows');
        if (ebox) ebox.innerHTML = '';
        (w.synonyms || []).forEach(s => this.addEditSynonymRow(s.word, s.meaning));
        document.getElementById('edit-modal').classList.remove('hidden');
        document.getElementById('edit-modal').classList.add('flex');
        lucide.createIcons();
      }

      closeEditModal() {
        document.getElementById('edit-modal').classList.add('hidden');
        document.getElementById('edit-modal').classList.remove('flex');
        this.editingId = null;
      }

      saveEdit(e) {
        e.preventDefault();
        const w = this.state.words.find(x => x.id === this.editingId);
        if (!w) return;
        w.category = document.getElementById('edit-category').value;
        w.word = document.getElementById('edit-word').value.trim();
        w.meaning = document.getElementById('edit-meaning').value.trim();
        w.note = document.getElementById('edit-note').value.trim();
        w.date = document.getElementById('edit-date').value;
        const synonyms = [];
        document.querySelectorAll('#edit-synonym-rows .syn-row').forEach(row => {
          const sw = row.querySelector('.syn-word').value.trim();
          const sm = row.querySelector('.syn-mean').value.trim();
          if (sw) synonyms.push({ word: sw, meaning: sm });
        });
        w.synonyms = synonyms;
        w.updatedAt = new Date().toISOString();
        this.saveData();
        this.scheduleSyncPush();
        this.closeEditModal();
        this.renderCategories();
        this.render();
      }

      deleteCurrentWord() {
        if (!confirm('确定删除这个单词吗？')) return;
        this.deletedWordIds.add(this.editingId);
        this.state.words = this.state.words.filter(x => x.id !== this.editingId);
        this.saveData();
        this.saveDeletedWords();
        this.scheduleSyncPush();
        this.closeEditModal();
        this.renderCategories();
        this.render();
      }

      // ===== Data Management =====

      exportData() {
        const data = JSON.stringify(this.state.words, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `单词本-${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (!Array.isArray(imported)) throw new Error('格式错误');
            this.state.words = imported.filter(w => w && w.id && !this.deletedWordIds.has(w.id));
            this.saveData();
            this.scheduleSyncPush();
            this.renderCategories();
            this.render();
            alert('导入成功');
          } catch (err) {
            alert('导入失败：' + err.message);
          }
        };
        reader.readAsText(file);
        input.value = '';
      }

      loadSampleData() {
        if (this.state.words.length > 0 && !confirm('加载示例数据会追加到现有数据之后，继续吗？')) return;
        this.state.words = [...this.state.words, ...DEFAULT_WORDS];
        this.saveData();
        this.renderCategories();
        this.render();
      }

      resetData() {
        if (!confirm('确定清空所有单词数据吗？此操作不可恢复。')) return;
        this.state.words = [];
        this.saveData();
        this.renderCategories();
        this.render();
      }
    }

    const app = new WordBookApp();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        app.closeEditModal();
        app.closeBulkImport();
      }
    });
  </script>
