              <button type="button" onclick="app.gotoDay(${todayDay})" class="text-xs text-indigo-600 hover:underline ${selDay === todayDay ? 'invisible' : ''}">回到今天</button>
            </div>
            <!-- 上一天 / 第N天 / 下一天：手机桌面都好用，避免翻一长串 chips -->
            <div class="flex items-center gap-2 mb-3">
              <button type="button" onclick="app.gotoDay(${Math.max(1, selDay - 1)})" ${selDay <= 1 ? 'disabled' : ''} class="px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 ${selDay <= 1 ? 'text-gray-300 bg-gray-50 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50'}">‹ 上一天</button>
              <div class="flex-1 text-center text-sm font-semibold text-gray-800">第 ${selDay} 天 / 共 ${days} 天</div>
              <button type="button" onclick="app.gotoDay(${Math.min(days, selDay + 1)})" ${selDay >= days ? 'disabled' : ''} class="px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 ${selDay >= days ? 'text-gray-300 bg-gray-50 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50'}">下一天 ›</button>
            </div>
            <!-- 全部天数 chips：桌面常显；手机默认折叠，点开选具体天 -->
            <div id="recite-day-cloud" class="flex flex-wrap gap-2 ${this.recite.dayCloudOpen ? '' : 'hidden'} md:!flex">
              ${Array.from({length: days}, (_, i) => {
                const d = i + 1;
                const done = this.dayDoneCount(d);
                const wds = this.getDayWords(d).length;
                const isSel = d === selDay;
                const isToday = d === todayDay;
                const chipCls = this.getDayChipClass(done, wds, isSel, isToday);
                return `<button type="button" onclick="app.gotoDay(${d})" class="min-w-[2.75rem] px-2.5 py-2 rounded-lg text-xs font-medium border transition-colors ${chipCls.bg}">
                  ${isToday ? '🔥' : ''}${d}<span class="${chipCls.count} ml-1">${done}/${wds}</span>
                </button>`;
              }).join('')}
            </div>
            <button type="button" onclick="app.toggleDayCloud()" class="md:hidden text-xs text-indigo-600 hover:underline mt-2">${this.recite.dayCloudOpen ? '收起全部天数 ▴' : '展开全部天数 ▾'}</button>
          </div>

          <!-- 待背列表 -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold text-gray-700">第 ${selDay} 天 · 待背 ${toDo.length} 词${recalledCount ? ` · ${recalledCount} 个回撤` : ''}</h3>
              <button onclick="app.toggleRevealAll()" class="text-xs text-indigo-600 hover:underline">${allOpen ? '收起全部释义' : '展开全部释义'}</button>
            </div>
            ${toDo.length ? `<div class="grid grid-cols-1 gap-2">${toDo.map(w => this.renderReciteCard(w, 'todo')).join('')}</div>` : `<div class="text-center text-sm text-gray-400 py-10">🎉 今日单词已全部背完！</div>`}
          </div>

          <!-- 已背折叠区 -->
          ${done.length ? `
          <div>
            <button onclick="app.toggleDoneCollapse()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-green-50 border border-green-200 text-sm font-medium text-green-700 hover:bg-green-100 transition-colors">
              <span>✓ 已背 ${done.length} 词（点击${this.recite.collapsedDone ? '展开' : '收起'}）</span>
              <i data-lucide="${this.recite.collapsedDone ? 'chevron-down' : 'chevron-up'}" class="w-4 h-4"></i>
            </button>
            ${this.recite.collapsedDone ? '' : `<div class="grid grid-cols-1 gap-2 mt-2">${done.map(w => this.renderReciteCard(w, 'done')).join('')}</div>`}
          </div>
          ` : ''}
          </div>
        `;
        lucide.createIcons();
      }

      renderMarked() {
        const content = document.getElementById('marked-content');
        if (!content) return;
        if (!window.VOCAB_IELTS) {
          content.innerHTML = '<div class="text-center text-gray-400 py-16">词表正在加载…</div>';
          return;
        }
        const all = (window.VOCAB_IELTS || []).filter(w => this.recite.marked.has(w.word));
        const toDo = all.filter(w => !this.recite.checked.has(w.word));
        const done = all.filter(w => this.recite.checked.has(w.word));
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        const stat = document.getElementById('marked-stat');
        if (stat) stat.textContent = `重点 ${all.length} · 待复习 ${toDo.length} · 今日 ${this.todayRecitedCount()}/${this.computePlan().perDay}`;
        content.innerHTML = `
          ${all.length === 0 ? `<div class="text-center text-sm text-gray-400 py-10">还没有标注重点词。在「背诵计划」里点单词右侧的 ★ 即可加入重点本。</div>` : ''}
          ${toDo.length ? `
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold text-gray-700">待复习 ${toDo.length} 词</h3>
              <button onclick="app.toggleMarkedRevealAll()" class="text-xs text-indigo-600 hover:underline">${allOpen ? '收起全部释义' : '展开全部释义'}</button>
            </div>
            <div class="grid grid-cols-1 gap-2">${toDo.map(w => this.renderReciteCard(w, 'todo')).join('')}</div>
          </div>
          ` : ''}
          ${done.length ? `
          <div>
            <button onclick="app.toggleMarkedDoneCollapse()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-green-50 border border-green-200 text-sm font-medium text-green-700 hover:bg-green-100 transition-colors">
              <span>✓ 已复习 ${done.length} 词（点击${this.recite.markedDoneCollapsed ? '展开' : '收起'}）</span>
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
            ${this.recite.markedDoneCollapsed ? '' : `<div class="grid grid-cols-1 gap-2 mt-2">${done.map(w => this.renderReciteCard(w, 'done')).join('')}</div>`}
          </div>
          ` : ''}
        `;
        lucide.createIcons();
      }

      toggleMark(word) {
        if (this.recite.marked.has(word)) this.recite.marked.delete(word);
        else this.recite.marked.add(word);
        this.saveRecite();
        if (this.view === 'marked') this.renderMarked();
        else this.renderRecite();
      }

      toggleMarkedRevealAll() {
        const all = (window.VOCAB_IELTS || []).filter(w => this.recite.marked.has(w.word));
        const toDo = all.filter(w => !this.recite.checked.has(w.word));
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        toDo.forEach(w => { this.recite.reveal[w.word] = !allOpen; });
        this.renderMarked();
      }

      toggleMarkedDoneCollapse() {
        this.recite.markedDoneCollapsed = !this.recite.markedDoneCollapsed;
        this.saveRecite();
        this.renderMarked();
      }

      gotoDay(d) {
        this.recite.selectedDay = d;
        // 手机上选完某天后自动收起天数云，保持界面清爽（桌面常显不受影响）
        if (window.innerWidth < 768) this.recite.dayCloudOpen = false;
        this.saveRecite();
        this.renderRecite();
      }

      toggleDayCloud() {
        this.recite.dayCloudOpen = !this.recite.dayCloudOpen;
        this.renderRecite();
      }

      renderReciteCard(w, mode) {
        const isDone = mode === 'done';
        const recalled = mode === 'todo' && this.recite.recalled.has(w.word);
        const revealed = !!this.recite.reveal[w.word];
        const isMarked = this.recite.marked.has(w.word);
        let cardCls = 'bg-white border rounded-xl p-4 transition-all ';
        if (isDone) cardCls += 'border-green-300 bg-green-50/40';
        else if (recalled) cardCls += 'border-orange-300 bg-orange-50/50';
        else cardCls += 'border-gray-200';
        const leftBtn = isDone
          ? `<button type="button" onclick="app.recallWord('${this.jsQuote(w.word)}')" class="flex-shrink-0 mt-0.5 px-2.5 py-1 text-xs font-medium text-orange-700 bg-orange-100 hover:bg-orange-200 rounded-lg" title="回撤到待背（说明没记住）">回撤</button>`
          : `<button type="button" onclick="app.toggleReciteCheck('${this.jsQuote(w.word)}')" class="flex-shrink-0 mt-0.5 w-6 h-6 rounded-md border-2 border-gray-300 hover:border-indigo-400 flex items-center justify-center transition-colors" title="标记已背"></button>`;
        const badge = isDone
          ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-green-100 text-green-700">已背</span>'
          : (recalled ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-orange-100 text-orange-700">↩ 回撤·重点</span>' : '');
        const markBtn = `<button type="button" onclick="app.toggleMark('${this.jsQuote(w.word)}')" class="flex-shrink-0 px-2 py-1 text-base leading-none ${isMarked ? 'text-amber-500' : 'text-gray-300 hover:text-amber-400'}" title="${isMarked ? '取消标注（移出重点本）' : '标注为重点（加入重点本）'}">★</button>`;
        return `
          <div class="${cardCls}">
            <div class="flex items-start gap-3">
              ${leftBtn}
              <div class="flex-1 min-w-0 cursor-pointer" onclick="app.toggleReveal('${this.jsQuote(w.word)}')">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-base font-bold text-gray-900">${this.escapeHtml(w.word)}</span>
                  ${w.phon ? `<span class="text-xs text-gray-400">/${this.escapeHtml(w.phon)}/</span>` : ''}
                  ${badge}
                </div>
                <p class="text-sm text-gray-700 mt-1 ${revealed ? '' : 'hidden'}">${this.escapeHtml(w.meaning)}</p>
              </div>
              ${markBtn}
              <button type="button" onclick="app.toggleReveal('${this.jsQuote(w.word)}')" class="flex-shrink-0 px-2.5 py-1 text-xs font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg">
                ${revealed ? '隐藏' : '释义'}
              </button>
            </div>
          </div>
        `;
      }

      toggleReveal(word) {
        this.recite.reveal[word] = !this.recite.reveal[word];
        if (this.view === 'marked') this.renderMarked();
        else this.renderRecite();
      }

      toggleRevealAll() {
        const selWords = this.getDayWords(this.recite.selectedDay || this.todayDayNum());
        const toDo = selWords.filter(w => !this.recite.checked.has(w.word));
        const allOpen = toDo.length > 0 && toDo.every(w => this.recite.reveal[w.word]);
        toDo.forEach(w => { this.recite.reveal[w.word] = !allOpen; });
        this.renderRecite();
      }

      toggleReciteCheck(word) {
        this.recite.checked.add(word);
        this.recite.recalled.delete(word);
        this.recite.checkedAt[word] = this.todayStr();
        this.saveRecite();
        this.renderCurrentView();
        this.showUndo(word);
      }

      showUndo(word) {
        this.undoIndex = word;
        const el = document.getElementById('recite-undo');
        const txt = document.getElementById('recite-undo-text');
        if (txt) txt.textContent = `已背「${this.escapeHtml(word)}」· 点错了？`;
        if (el) {
          el.classList.remove('hidden');
          clearTimeout(this.undoTimer);
          // 4 秒内可撤销，足够看清并点击
          this.undoTimer = setTimeout(() => { el.classList.add('hidden'); this.undoIndex = null; }, 4000);
        }
      }

      undoLast() {
        if (this.undoIndex == null) return;
        this.recite.checked.delete(this.undoIndex);
        delete this.recite.checkedAt[this.undoIndex];
        this.undoIndex = null;
        this.saveRecite();
        this.renderCurrentView();
        const el = document.getElementById('recite-undo');
        if (el) el.classList.add('hidden');
        clearTimeout(this.undoTimer);
      }

      recallWord(word) {
        this.recite.checked.delete(word);
        delete this.recite.checkedAt[word];
        this.recite.recalled.add(word);
        this.saveRecite();
        this.renderCurrentView();
      }

      toggleDoneCollapse() {
        this.recite.collapsedDone = !this.recite.collapsedDone;
        this.saveRecite();
        this.renderRecite();
      }

      exportRecite() {
        const data = JSON.stringify({
          days: this.recite.days,
          startDate: this.recite.startDate,
          checked: [...this.recite.checked],
          recalled: [...this.recite.recalled],
          marked: [...this.recite.marked],
          checkedAt: this.recite.checkedAt,
          selectedDay: this.recite.selectedDay,
          prep: {
            examDate: this.prep.examDate,
            target: this.prep.target,
            currentTotal: this.prep.currentTotal,
            testsTotal: this.prep.testsTotal,
            testsDone: this.prep.testsDone,
            writingGoal: this.prep.writingGoal,
            writingDone: this.prep.writingDone,
            speakingGoal: this.prep.speakingGoal,
            speakingDone: this.prep.speakingDone,
            daily: this.prep.daily
          }
        }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `背诵进度-${this.todayStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      importRecite(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const d = JSON.parse(e.target.result);
            this.recite.days = d.days || 30;
            this.recite.startDate = d.startDate || this.todayStr();
            this.recite.checked = new Set(d.checked || []);
            this.recite.recalled = new Set(d.recalled || []);
            this.recite.marked = new Set(d.marked || []);
            this.recite.checkedAt = d.checkedAt || {};
            this.recite.selectedDay = d.selectedDay || this.todayDayNum();
            if (d.prep) {
              const rp = d.prep;
              this.prep.examDate = rp.examDate || this.prep.examDate;
              this.prep.target = Object.assign({}, this.prep.target, rp.target || {});
              if (typeof rp.currentTotal === 'number') this.prep.currentTotal = rp.currentTotal;
              if (typeof rp.testsTotal === 'number') this.prep.testsTotal = rp.testsTotal;
              this.prep.testsDone = Object.assign({}, this.prep.testsDone, rp.testsDone || {});
              if (typeof rp.writingGoal === 'number') this.prep.writingGoal = rp.writingGoal;
              if (typeof rp.writingDone === 'number') this.prep.writingDone = rp.writingDone;
              if (typeof rp.speakingGoal === 'number') this.prep.speakingGoal = rp.speakingGoal;
              if (typeof rp.speakingDone === 'number') this.prep.speakingDone = rp.speakingDone;
              this.prep.daily = Object.assign({}, this.prep.daily, rp.daily || {});
            }
            this.saveRecite();
            this.savePrep();
            this.renderCurrentView();
            alert('进度导入成功');
          } catch (err) {
            alert('导入失败：' + err.message);
          }
        };
        reader.readAsText(file);
        input.value = '';
      }

      resetRecite() {
        if (!confirm('确定清空所有打卡记录吗？词表保留，仅清除「已背」标记。')) return;
        this.recite.checked = new Set();
        this.recite.recalled = new Set();
        this.saveRecite();
        this.renderRecite();
      }

      // ===== Cloud Sync (GitHub) =====
      syncEnabled() {
        const c = this.loadSyncCfg();
        return !!(c.enabled && c.token);
      }
      loadSyncCfg() {
        try { return JSON.parse(localStorage.getItem('wordbook_sync_cfg')) || {}; } catch (e) { return {}; }
      }
      saveSyncCfg(cfg) {
        localStorage.setItem('wordbook_sync_cfg', JSON.stringify(cfg));
      }
      nowHM() {
        const d = new Date();
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      updateSyncStatus(text, type) {
        const cls = { ok: 'bg-green-50 text-green-700', err: 'bg-red-50 text-red-700', idle: 'bg-gray-100 text-gray-500', syncing: 'bg-indigo-50 text-indigo-700' };
        const el = document.getElementById('sync-status');
        if (el) {
          el.className = 'text-xs px-2 py-1 rounded-full ' + (cls[type] || cls.idle);
          el.textContent = text;
        }
        const dot = document.getElementById('sidebar-sync-dot');
        if (dot) {
          const dotCls = { ok: 'bg-green-500', err: 'bg-red-500', idle: 'bg-gray-300', syncing: 'bg-indigo-500 animate-pulse' };
          dot.className = 'w-2 h-2 rounded-full ' + (dotCls[type] || dotCls.idle);
        }
      }
      async ghFetch(method, path, body) {
        const c = this.loadSyncCfg();
        return fetch('https://api.github.com' + path, {
          method: method,
          headers: {
            Authorization: 'Bearer ' + (c.token || ''),
            'Content-Type': 'application/json',
            Accept: 'application/vnd.github+json'
          },
          body: body ? JSON.stringify(body) : undefined
        });
      }
      async ensureSyncRepo() {
        const c = this.loadSyncCfg();
        const repoPath = '/repos/' + c.owner + '/' + c.repo;
        let res = await this.ghFetch('GET', repoPath);
        if (res.status === 200) return true;
        if (res.status === 404) {
          res = await this.ghFetch('POST', '/user/repos', {
            name: c.repo, private: true,
            description: '单词本背诵进度云同步（自动创建）', auto_init: false
          });
          if (res.status === 201 || res.status === 200 || res.status === 422) return true;
          throw new Error('创建仓库失败：HTTP ' + res.status);
        }
        throw new Error('仓库检查失败：HTTP ' + res.status);
      }
      async pushRecite() {
        if (!this.syncEnabled()) return;
        this.updateSyncStatus('同步中…', 'syncing');
        try {
          const c = this.loadSyncCfg();
          const content = JSON.stringify({
            days: this.recite.days,
            startDate: this.recite.startDate,
            checked: Array.from(this.recite.checked),
            recalled: Array.from(this.recite.recalled),
            selectedDay: this.recite.selectedDay,
            prep: {
              examDate: this.prep.examDate,
              target: this.prep.target,
              currentTotal: this.prep.currentTotal,
              testsTotal: this.prep.testsTotal,
              testsDone: this.prep.testsDone,
              writingGoal: this.prep.writingGoal,
              writingDone: this.prep.writingDone,
              speakingGoal: this.prep.speakingGoal,
              speakingDone: this.prep.speakingDone,
              daily: this.prep.daily
            },
            updatedAt: new Date().toISOString()
          }, null, 2);
          const filePath = '/repos/' + c.owner + '/' + c.repo + '/contents/' + c.path;
          let sha = null;
          const head = await this.ghFetch('GET', filePath);
          if (head.status === 200) { const j = await head.json(); sha = j.sha; }
          const body = { message: 'sync recite progress', content: utf8ToBase64(content) };
          if (sha) body.sha = sha;
          const res = await this.ghFetch('PUT', filePath, body);
          if (res.status === 200 || res.status === 201) {
            this.updateSyncStatus('已同步 ' + this.nowHM(), 'ok');
          } else {
            this.updateSyncStatus('同步失败 ' + res.status, 'err');
          }
        } catch (e) {
          this.updateSyncStatus('同步失败', 'err');
        }
      }
      async pullRecite() {
        if (!this.syncEnabled()) return;
        try {
          const c = this.loadSyncCfg();
          const filePath = '/repos/' + c.owner + '/' + c.repo + '/contents/' + c.path;
          const res = await this.ghFetch('GET', filePath);
          if (res.status !== 200) return;
          const j = await res.json();
          const remote = JSON.parse(base64ToUtf8(j.content));
          if (Array.isArray(remote.checked)) remote.checked.forEach(w => this.recite.checked.add(w));
          if (Array.isArray(remote.recalled)) remote.recalled.forEach(w => { this.recite.recalled.add(w); this.recite.checked.delete(w); });
          if (remote.days) this.recite.days = remote.days;
          if (remote.startDate) this.recite.startDate = remote.startDate;
          if (remote.selectedDay) this.recite.selectedDay = remote.selectedDay;
          if (remote.prep) {
            const rp = remote.prep;
            if (rp.examDate) this.prep.examDate = rp.examDate;
            this.prep.target = Object.assign({}, this.prep.target, rp.target || {});
            if (typeof rp.currentTotal === 'number') this.prep.currentTotal = rp.currentTotal;
            if (typeof rp.testsTotal === 'number') this.prep.testsTotal = rp.testsTotal;
            this.prep.testsDone = Object.assign({}, this.prep.testsDone, rp.testsDone || {});
            if (typeof rp.writingGoal === 'number') this.prep.writingGoal = rp.writingGoal;
            if (typeof rp.writingDone === 'number') this.prep.writingDone = rp.writingDone;
            if (typeof rp.speakingGoal === 'number') this.prep.speakingGoal = rp.speakingGoal;
            if (typeof rp.speakingDone === 'number') this.prep.speakingDone = rp.speakingDone;
            Object.assign(this.prep.daily, rp.daily || {});
          }
          this.saveRecite();
          this.savePrep();
          if (this.view === 'recite') this.renderRecite();
          if (this.view === 'prep') this.renderPrep();
          this.updateSyncStatus('已同步 ' + this.nowHM(), 'ok');
        } catch (e) {
          // 拉取失败不阻断本地使用
        }
      }
      scheduleSyncPush() {
        if (!this.syncEnabled()) return;
        clearTimeout(this._syncTimer);
        this._syncTimer = setTimeout(() => this.pushRecite(), 1500);
      }
      // 抽屉（手机侧栏）
      toggleDrawer() {
        const aside = document.getElementById('app-aside');
        const overlay = document.getElementById('drawer-overlay');
        if (!aside) return;
        const open = aside.classList.contains('-translate-x-full');
        aside.classList.toggle('-translate-x-full');
        aside.classList.toggle('translate-x-0');
        if (overlay) overlay.classList.toggle('hidden', !open);
      }
      closeDrawer() {
        const aside = document.getElementById('app-aside');
        const overlay = document.getElementById('drawer-overlay');
        if (aside) { aside.classList.add('-translate-x-full'); aside.classList.remove('translate-x-0'); }
        if (overlay) overlay.classList.add('hidden');
      }
      // 云同步设置弹窗
      openSync() {
        const c = this.loadSyncCfg();
        document.getElementById('sync-enabled').checked = !!c.enabled;
        document.getElementById('sync-token').value = c.token || '';
        document.getElementById('sync-owner').value = c.owner || 'litostar';
        document.getElementById('sync-repo').value = c.repo || 'wordbook-sync';
        document.getElementById('sync-msg').textContent = '';
        document.getElementById('sync-modal').classList.remove('hidden');
        document.getElementById('sync-modal').classList.add('flex');
        lucide.createIcons();
      }
      closeSync() {
        document.getElementById('sync-modal').classList.add('hidden');
        document.getElementById('sync-modal').classList.remove('flex');
      }
      toggleTokenVisible() {
        const inp = document.getElementById('sync-token');
        inp.type = inp.type === 'password' ? 'text' : 'password';
      }
      async saveSyncSettings() {
        const enabled = document.getElementById('sync-enabled').checked;
        const token = document.getElementById('sync-token').value.trim();
        const owner = document.getElementById('sync-owner').value.trim() || 'litostar';
        const repo = document.getElementById('sync-repo').value.trim() || 'wordbook-sync';
        const msg = document.getElementById('sync-msg');
        if (enabled && !token) { msg.innerHTML = '<span class="text-red-600">启用同步需要填写 Token</span>'; return; }
        this.saveSyncCfg({ enabled: enabled, token: token, owner: owner, repo: repo, path: 'recite_progress.json' });
        msg.innerHTML = '<span class="text-gray-500">正在测试连接…</span>';
        try {
          await this.ensureSyncRepo();
          await this.pullRecite();
          await this.pushRecite();
          msg.innerHTML = '<span class="text-green-600">✓ 同步已启用并测试成功</span>';
          this.updateSyncStatus('已同步 ' + this.nowHM(), 'ok');
        } catch (e) {
          msg.innerHTML = '<span class="text-red-600">连接失败：' + this.escapeHtml(e.message) + '</span>';
          this.updateSyncStatus('同步失败', 'err');
        }
      }
      async manualSync() {
        const msg = document.getElementById('sync-msg');
        try {
          await this.pullRecite();
          await this.pushRecite();
          if (msg) msg.innerHTML = '<span class="text-green-600">✓ 同步完成</span>';
        } catch (e) {
          if (msg) msg.innerHTML = '<span class="text-red-600">同步失败：' + this.escapeHtml(e.message) + '</span>';
        }
      }
      disconnectSync() {
        if (!confirm('断开云同步？本机进度保留，但不再自动上传/下载。')) return;
        const c = this.loadSyncCfg();
        this.saveSyncCfg(Object.assign({}, c, { enabled: false }));
        this.updateSyncStatus('未启用云同步', 'idle');
        this.closeSync();
      }

      loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            this.state.words = JSON.parse(raw);
          } else {
            this.state.words = [...DEFAULT_WORDS];
            this.saveData();
          }
        } catch (e) {
          this.state.words = [...DEFAULT_WORDS];
        }
      }

      saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state.words));
      }

      setCategory(cat) {
        this.state.category = cat;
        // 联动添加表单的分类下拉框
        const sel = document.getElementById('input-category');
        if (sel && cat !== 'all') sel.value = cat;
        this.renderCategories();
        this.render();
        this.closeDrawer();
      }

      setSearch(val) {
        this.state.search = val.trim().toLowerCase();
        this.render();
      }

      getFilteredWords() {
        return this.state.words.filter(w => {
          const catMatch = this.state.category === 'all' || w.category === this.state.category;
          const searchMatch = !this.state.search ||
            w.word.toLowerCase().includes(this.state.search) ||
            w.meaning.toLowerCase().includes(this.state.search) ||
            (w.note && w.note.toLowerCase().includes(this.state.search));
          return catMatch && searchMatch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date) || new Date(b.createdAt) - new Date(a.createdAt));
      }

      groupByDate(words) {
        const groups = {};
        words.forEach(w => {
          if (!groups[w.date]) groups[w.date] = [];
          groups[w.date].push(w);
        });
        return Object.entries(groups).sort((a, b) => new Date(b[0]) - new Date(a[0]));
      }

      renderCategories() {
        const counts = { all: this.state.words.length };
        Object.keys(CATEGORIES).forEach(c => counts[c] = this.state.words.filter(w => w.category === c).length);

        Object.keys(CATEGORIES).forEach(cat => {
          document.getElementById(`count-${cat}`).textContent = counts[cat];
        });
        document.getElementById('count-all').textContent = counts.all;

        document.querySelectorAll('.cat-btn').forEach(btn => {
          btn.className = 'cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left text-gray-600 hover:bg-gray-50';
        });

        const active = document.getElementById(`cat-${this.state.category}`);
        if (active) {
          active.className = 'cat-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left bg-indigo-50 text-indigo-700';
        }

        const catInfo = CATEGORIES[this.state.category];
        document.getElementById('page-title').textContent = this.state.category === 'all' ? '全部单词' : `${catInfo.name}单词`;
      }

      render() {
        const filtered = this.getFilteredWords();
        const container = document.getElementById('word-list');

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-16 text-gray-400 fade-in">
              <i data-lucide="book-x" class="w-12 h-12 mb-3 text-gray-300"></i>
              <p class="text-sm">暂无单词，添加一个吧</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        const groups = this.groupByDate(filtered);
        container.innerHTML = groups.map(([date, words]) => `
          <div class="fade-in">
            <div class="flex items-center gap-3 mb-3">
              <h3 class="text-sm font-bold text-gray-700">${formatDate(date)}</h3>
              <div class="flex-1 h-px bg-gray-200"></div>
              <span class="text-xs text-gray-400">${words.length} 个</span>
            </div>
            <div class="grid grid-cols-1 gap-2">
              ${words.map(w => this.renderWordCard(w)).join('')}
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      }

      renderWordCard(w) {
        const cat = CATEGORIES[w.category];
        const isSelected = this.state.selectedIds.has(w.id);

        if (this.state.selectMode) {
          return `
            <div onclick="app.toggleSelect('${w.id}')" class="group bg-white border rounded-xl p-4 transition-all cursor-pointer ${isSelected ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-gray-200 hover:border-indigo-200'}">
              <div class="flex items-start gap-3">
                <div class="flex-shrink-0 pt-0.5">
                  <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition-colors ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'border-gray-300 group-hover:border-indigo-400'}">
                    ${isSelected ? '<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
                  </div>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="text-base font-bold text-gray-900">${this.escapeHtml(w.word)}</span>
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-${cat.color}-50 text-${cat.color}-600">
                      <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                      ${cat.name}
                    </span>
                    ${w.mastered ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-green-50 text-green-600">已掌握</span>' : ''}
                  </div>
                  <p class="text-sm text-gray-700">${this.escapeHtml(w.meaning)}</p>
                  ${w.note ? `<p class="text-xs text-gray-500 mt-1.5 line-clamp-2">${this.escapeHtml(w.note)}</p>` : ''}
                </div>
              </div>
            </div>
          `;
        }

        return `
          <div onclick="app.openEdit('${w.id}')" class="group bg-white border border-gray-200 rounded-xl p-4 hover:shadow-md hover:border-indigo-200 transition-all cursor-pointer">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="text-base font-bold text-gray-900">${this.escapeHtml(w.word)}</span>
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-${cat.color}-50 text-${cat.color}-600">
                    <i data-lucide="${cat.icon}" class="w-3 h-3"></i>
                    ${cat.name}
                  </span>
                  ${w.mastered ? '<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-green-50 text-green-600">已掌握</span>' : ''}
                </div>
                <p class="text-sm text-gray-700">${this.escapeHtml(w.meaning)}</p>
                ${w.note ? `<p class="text-xs text-gray-500 mt-1.5 line-clamp-2">${this.escapeHtml(w.note)}</p>` : ''}
              </div>
              <div class="flex flex-col gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                <button type="button" onclick="event.stopPropagation(); app.toggleMastered('${w.id}')" class="p-1.5 text-gray-400 hover:text-green-600 hover:bg-green-50 rounded-lg" title="标记掌握">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      jsQuote(text) {
        return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
      }

      addWord(e) {
        e.preventDefault();
        const word = document.getElementById('input-word').value.trim();
        const meaning = document.getElementById('input-meaning').value.trim();
        const note = document.getElementById('input-note').value.trim();
        const date = document.getElementById('input-date').value;
        const category = document.getElementById('input-category').value;

        if (!word || !meaning || !date) return;

        this.state.words.unshift({
          id: generateId(),
          word,
          meaning,
          note,
          category,
          date,
          createdAt: new Date().toISOString(),
          mastered: false
        });

        this.saveData();
        document.getElementById('input-word').value = '';
        document.getElementById('input-meaning').value = '';
        document.getElementById('input-note').value = '';
        this.renderCategories();
        this.render();
      }

      toggleMastered(id) {
        const w = this.state.words.find(x => x.id === id);
        if (w) {
          w.mastered = !w.mastered;
          this.saveData();
          this.render();
        }
      }

      // ===== Select Mode =====

      toggleSelectMode() {
        this.state.selectMode = !this.state.selectMode;
        if (!this.state.selectMode) {
          this.state.selectedIds.clear();
        }
        this.updateSelectUI();
        this.render();
      }

      updateSelectUI() {
        const toolbar = document.getElementById('select-toolbar');
        const batchBar = document.getElementById('batch-bar');
        const btn = document.getElementById('btn-select-mode');

        if (this.state.selectMode) {
          toolbar.classList.remove('hidden');
          toolbar.classList.add('flex');
          btn.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-300');
          btn.classList.remove('border-gray-200', 'text-gray-600');
          batchBar.classList.remove('hidden');
        } else {
          toolbar.classList.add('hidden');
          toolbar.classList.remove('flex');
          btn.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-300');
          btn.classList.add('border-gray-200');
          batchBar.classList.add('hidden');
        }
        this.updateSelectCount();
      }

      toggleSelect(id) {
        if (this.state.selectedIds.has(id)) {
          this.state.selectedIds.delete(id);
        } else {
          this.state.selectedIds.add(id);
        }
        this.updateSelectCount();
        this.render();
      }

      selectAll() {
        const filtered = this.getFilteredWords();
        filtered.forEach(w => this.state.selectedIds.add(w.id));
        this.updateSelectCount();
        this.render();
      }

      deselectAll() {
        this.state.selectedIds.clear();
        this.updateSelectCount();
        this.render();
      }

      updateSelectCount() {
        const count = this.state.selectedIds.size;
        document.getElementById('select-count').textContent = `已选 ${count} 个`;
        document.getElementById('batch-count').textContent = count;
      }

      batchDelete() {
        if (this.state.selectedIds.size === 0) return;
        if (!confirm(`确定删除选中的 ${this.state.selectedIds.size} 个单词吗？此操作不可恢复。`)) return;
        this.state.words = this.state.words.filter(w => !this.state.selectedIds.has(w.id));
        this.state.selectedIds.clear();
        this.saveData();
        this.toggleSelectMode();
        this.renderCategories();
        this.render();
      }

      batchMove() {
        const targetCat = document.getElementById('batch-move-category').value;
        if (!targetCat) {
          alert('请先选择目标分类');
          return;
        }
        if (this.state.selectedIds.size === 0) return;
        this.state.words.forEach(w => {
          if (this.state.selectedIds.has(w.id)) {
            w.category = targetCat;
          }
        });
        this.saveData();
        document.getElementById('batch-move-category').value = '';
        this.state.selectedIds.clear();
        this.toggleSelectMode();
        this.renderCategories();
        this.render();
      }

      batchExport() {
        if (this.state.selectedIds.size === 0) return;
        const selected = this.state.words.filter(w => this.state.selectedIds.has(w.id));
        const data = JSON.stringify(selected, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `单词本-选中-${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      // ===== Bulk Import =====

      openBulkImport() {
        document.getElementById('bulk-date').valueAsDate = new Date();
        if (this.state.category !== 'all') {
          document.getElementById('bulk-category').value = this.state.category;
        }
        document.getElementById('bulk-text').value = '';
        document.getElementById('bulk-preview').classList.add('hidden');
        document.getElementById('btn-confirm-import').disabled = true;
        document.getElementById('bulk-import-modal').classList.remove('hidden');
        document.getElementById('bulk-import-modal').classList.add('flex');
        lucide.createIcons();
        setTimeout(() => document.getElementById('bulk-text').focus(), 100);
      }

      closeBulkImport() {
        document.getElementById('bulk-import-modal').classList.add('hidden');
        document.getElementById('bulk-import-modal').classList.remove('flex');
        this.bulkParsed = [];
      }

      parseBulkText() {
        const text = document.getElementById('bulk-text').value.trim();
        if (!text) {
          alert('请先粘贴单词文本');
          return;
        }

        const lines = text.split('\n').filter(l => l.trim());
        this.bulkParsed = lines.map(line => {
          const trimmed = line.trim();
          let parts;

          // Try different separators in priority order
          if (trimmed.includes('\t')) {
            parts = trimmed.split('\t');
          } else if (trimmed.includes(' | ')) {
            parts = trimmed.split(' | ');
          } else if (trimmed.includes('|')) {
            parts = trimmed.split('|');
          } else if (trimmed.includes(' — ')) {
            parts = trimmed.split(' — ');
          } else if (trimmed.includes(' - ')) {
            parts = trimmed.split(' - ');
          } else if (trimmed.includes('：')) {
            parts = trimmed.split('：');
          } else if (trimmed.includes(': ')) {
            parts = trimmed.split(': ');
          } else {
            // No recognized separator, try space
            const spaceIdx = trimmed.indexOf(' ');
            if (spaceIdx > 0) {
              parts = [trimmed.slice(0, spaceIdx), trimmed.slice(spaceIdx + 1)];
            } else {
              parts = [trimmed];
            }
          }

          // Clean up parts
          parts = parts.map(p => p.trim()).filter(p => p);
          const word = parts[0] || '';
          const meaning = parts[1] || '';
          const note = parts[2] || '';

          return { word, meaning, note };
        }).filter(w => w.word);

        // Render preview
        const previewDiv = document.getElementById('bulk-preview');
        const previewList = document.getElementById('preview-list');
        document.getElementById('preview-count').textContent = this.bulkParsed.length;

        if (this.bulkParsed.length === 0) {
          previewList.innerHTML = '<div class="p-3 text-sm text-gray-400">未解析到有效单词</div>';
        } else {
          previewList.innerHTML = this.bulkParsed.map((w, i) => `
            <div class="p-3 flex items-center gap-3 hover:bg-gray-50">
              <span class="text-xs text-gray-400 w-6 flex-shrink-0">${i + 1}</span>
              <span class="text-sm font-medium text-gray-900 flex-shrink-0 min-w-0 truncate">${this.escapeHtml(w.word)}</span>
              <span class="text-sm text-gray-600 flex-1 min-w-0 truncate">${this.escapeHtml(w.meaning) || '<span class="text-red-400">（缺释义）</span>'}</span>
              ${w.note ? `<span class="text-xs text-gray-400 truncate flex-shrink-0">${this.escapeHtml(w.note)}</span>` : ''}
            </div>
          `).join('');
        }

        previewDiv.classList.remove('hidden');
        document.getElementById('btn-confirm-import').disabled = this.bulkParsed.length === 0;
        lucide.createIcons();
      }

      confirmBulkImport() {
        if (this.bulkParsed.length === 0) return;
        const category = document.getElementById('bulk-category').value;
        const date = document.getElementById('bulk-date').value;
        if (!date) {
          alert('请选择日期');
          return;
        }

        this.bulkParsed.forEach((w, i) => {
          this.state.words.unshift({
            id: generateId() + '_' + i,
            word: w.word,
            meaning: w.meaning,
            note: w.note,
            category,
            date,
            createdAt: new Date(Date.now() + i).toISOString(),
            mastered: false
          });
        });

        const count = this.bulkParsed.length;
        this.saveData();
        this.closeBulkImport();
        this.renderCategories();
        this.render();
        alert(`成功导入 ${count} 个单词`);
      }

      // ===== Edit Modal =====

      openEdit(id) {
        const w = this.state.words.find(x => x.id === id);
        if (!w) return;
        this.editingId = id;
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-category').value = w.category;
        document.getElementById('edit-word').value = w.word;
        document.getElementById('edit-meaning').value = w.meaning;
        document.getElementById('edit-note').value = w.note || '';
        document.getElementById('edit-date').value = w.date;
        document.getElementById('edit-modal').classList.remove('hidden');
        document.getElementById('edit-modal').classList.add('flex');
        lucide.createIcons();
      }

      closeEditModal() {
        document.getElementById('edit-modal').classList.add('hidden');
        document.getElementById('edit-modal').classList.remove('flex');
        this.editingId = null;
      }

      saveEdit(e) {
        e.preventDefault();
        const w = this.state.words.find(x => x.id === this.editingId);
        if (!w) return;
        w.category = document.getElementById('edit-category').value;
        w.word = document.getElementById('edit-word').value.trim();
        w.meaning = document.getElementById('edit-meaning').value.trim();
        w.note = document.getElementById('edit-note').value.trim();
        w.date = document.getElementById('edit-date').value;
        this.saveData();
        this.closeEditModal();
        this.renderCategories();
        this.render();
      }

      deleteCurrentWord() {
        if (!confirm('确定删除这个单词吗？')) return;
        this.state.words = this.state.words.filter(x => x.id !== this.editingId);
        this.saveData();
        this.closeEditModal();
        this.renderCategories();
        this.render();
      }

      // ===== Data Management =====

      exportData() {
        const data = JSON.stringify(this.state.words, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `单词本-${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (!Array.isArray(imported)) throw new Error('格式错误');
            this.state.words = imported;
            this.saveData();
            this.renderCategories();
            this.render();
            alert('导入成功');
          } catch (err) {
            alert('导入失败：' + err.message);
          }
        };
        reader.readAsText(file);
        input.value = '';
      }

      loadSampleData() {
        if (this.state.words.length > 0 && !confirm('加载示例数据会追加到现有数据之后，继续吗？')) return;
        this.state.words = [...this.state.words, ...DEFAULT_WORDS];
        this.saveData();
        this.renderCategories();
        this.render();
      }

      resetData() {
        if (!confirm('确定清空所有单词数据吗？此操作不可恢复。')) return;
        this.state.words = [];
        this.saveData();
        this.renderCategories();
        this.render();
      }
    }

    const app = new WordBookApp();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        app.closeEditModal();
        app.closeBulkImport();
      }
    });
  </script>
</body>
